<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구매하기</title>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#f5f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:2rem;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
width:320px;
text-align:center;
}

h2{
margin-bottom:10px;
}

.plan{
font-size:1.5rem;
font-weight:bold;
color:#4a6cff;
margin-bottom:10px;
}

.price{
font-size:1.2rem;
margin-bottom:20px;
}

.info{
font-size:0.9rem;
color:#666;
margin-bottom:15px;
}

input{
width:100%;
padding:10px;
margin-bottom:15px;
border-radius:8px;
border:1px solid #ddd;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#4a6cff;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.85;
}

.back{
margin-top:10px;
display:block;
color:#888;
text-decoration:none;
font-size:0.9rem;
}
</style>
</head>

<body>

<div class="box">

<h2>플랜 구매</h2>

<div class="plan" id="planName"></div>
<div class="price" id="planPrice"></div>

<div class="info">
토스뱅크 1908-1218-3479<br>
입금 후 확인되면 자동으로 적용됩니다 😉
</div>

<input type="email" id="email" placeholder="이메일 입력">

<button onclick="pay()">구매 진행</button>

<a href="danipremium.html" class="back">← 돌아가기</a>

</div>

<script>

// 🔥 Apps Script URL (여기만 바꿔)
const SCRIPT_URL = "https://script.google.com/macros/s/{googlesheetid}/exec";

// URL에서 플랜 가져오기
const params = new URLSearchParams(window.location.search);
const plan = params.get("plan");

// 플랜 표시
const planName = document.getElementById("planName");
const planPrice = document.getElementById("planPrice");

if(plan === "basic"){
  planName.innerText = "Basic";
  planPrice.innerText = "₩1000";
}
else if(plan === "premium"){
  planName.innerText = "Premium";
  planPrice.innerText = "₩3500";
}
else{
  planName.innerText = "잘못된 접근";
  planPrice.innerText = "";
}

// 코드 생성
function generateCode(){
  return Math.floor(100 + Math.random() * 900);
}

// 구매 버튼
function pay(){
  const email = document.getElementById("email").value;

  if(!email){
    alert("이메일을 입력해주세요.");
    return;
  }

  const code = generateCode();
  const fullCode = "DP" + code;

  // 🔥 Google Sheets로 전송
  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      email: email,
      code: fullCode,
      plan: plan
    })
  })
  .then(res => res.json())
  .then(data => {
    alert(
`입금자명을 ${fullCode} 로 설정해서 입금하세요!

입금 확인 후
👉 ${email} 로 키를 보내드립니다 😎`
    );
  })
  .catch(err => {
    alert("오류가 발생했습니다. 나중에 다시 시도해주세요.");
    console.error(err);
  });
}

</script>

</body>
</html>
