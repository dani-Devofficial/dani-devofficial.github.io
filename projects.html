<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DaniDevLab · Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #f4f4f5;
    --card-bg: #ececee;
    --text-main: #18181b;
    --text-sub: #71717a;
    --text-faint: #a1a1aa;
    --border: #e4e4e7;
    --radius: 20px;
    --purple: #8b7cf6;
    --purple-dark: #7c6ff2;
    --blue: #2f6fed;
    --gold: #d98f2b;
    --gold-bg: #f6e3c2;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 64px 24px 120px;
  }

  /* ---------- Header ---------- */
  .header{
    margin-bottom: 32px;
  }
  .header h1{
    font-size: 34px;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.5px;
  }
  .header p.sub{
    margin-top: 14px;
    font-size: 15.5px;
    color: var(--text-sub);
  }
  .header nav{
    margin-top: 20px;
    display:flex;
    gap: 20px;
    font-size: 15px;
    color: var(--text-main);
  }
  .header nav a{
    color: var(--text-main);
    text-decoration: none;
  }
  .header nav a:hover{ color: var(--purple); }

  /* ---------- Filter ---------- */
  .filter-row{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 32px;
    margin-bottom: 8px;
  }
  .filter-btn{
    border: none;
    background: var(--card-bg);
    color: var(--text-sub);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .filter-btn:hover{
    color: var(--text-main);
  }
  .filter-btn.active{
    background: var(--text-main);
    color: #fff;
  }

  /* ---------- Project grid ---------- */
  .project-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 24px;
  }

  .project-card{
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
    border: none;
    text-align: left;
    font-family: inherit;
    width: 100%;
    padding: 0;
  }
  .project-card:hover{
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.08);
  }

  .project-thumb{
    aspect-ratio: 16 / 11;
    position: relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow: hidden;
  }
  .project-thumb img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .project-thumb .placeholder-icon{
    font-size: 40px;
    opacity: 0.85;
  }

  .project-body{
    padding: 20px 22px 22px;
    display:flex;
    flex-direction: column;
    gap: 6px;
  }
  .project-title-row{
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .project-title{
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }
  .project-title-row .arrow{
    font-size: 14px;
    color: var(--text-faint);
    transition: transform 0.2s ease;
  }
  .project-card:hover .arrow{
    transform: translateX(3px);
    color: var(--text-main);
  }
  .project-desc{
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text-sub);
  }
  .project-tags{
    margin-top: 10px;
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .project-tag{
    font-size: 11px;
    font-weight: 700;
    color: var(--text-sub);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
  }

  .no-result{
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 0;
    color: var(--text-faint);
    font-size: 14px;
  }

  /* ---------- Bottom tab bar ---------- */
  .tabbar{
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 999px;
    padding: 6px;
    display:flex;
    gap: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 50;
  }
  .tabbar button{
    border:none;
    background: transparent;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-sub);
    cursor:pointer;
    transition: all 0.3s ease;
  }
  .tabbar button.active{
    background: var(--card-bg);
    color: var(--text-main);
  }

/* ---------- Modal ---------- */
.modal-overlay{
  position: fixed;
  inset: 0;
  background: rgba(24,24,27,0.55);

  /* 기존 display:none 제거 */
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 100;

  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0.25s ease;
}

.modal-overlay.open{
  opacity: 1;
  visibility: visible;
}

.modal-card{
  background: #fff;
  border-radius: 28px;
  width: 100%;
  max-width: 940px;
  max-height: 88vh;
  overflow-y: auto;
  position: relative;
  padding: 40px 44px 44px;

  /* 등장 애니메이션 */
  transform: translateY(18px) scale(0.97);
  opacity: 0;
  transition:
    transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 0.22s ease;
}

.modal-overlay.open .modal-card{
  transform: translateY(0) scale(1);
  opacity: 1;
}
  .modal-card{
    background: #fff;
    border-radius: 28px;
    width: 100%;
    max-width: 940px;
    max-height: 88vh;
    overflow-y: auto;
    position: relative;

  .modal-head-info{

  }
  .modal-title{
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.5px;

  }
  .modal-desc{
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-sub);
    margin-bottom: 18px;
  }
  .modal-links{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .modal-link-btn{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    background: var(--card-bg);
    color: var(--text-main);
    font-size: 13.5px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 999px;
    text-decoration: none;
  }
  .modal-link-btn:hover{ background: var(--border); }

  /* ---------- Modal info grid ---------- */
  .modal-info-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-top: 32px;
  }
  .modal-info-cell{
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px 16px;
    text-align: center;
  }
  .modal-info-label{
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .modal-info-value{
    font-size: 16px;
    font-weight: 800;
  }

  /* ---------- Modal screenshots ---------- */
  .modal-shots-section{
    margin-top: 36px;
  }
  .modal-shots-eyebrow{
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .modal-shots-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .modal-shots-title{
    font-size: 19px;
    font-weight: 800;
  }
  .modal-shots-nav{
    display:flex;
    gap: 8px;
  }
  .shots-nav-btn{
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--card-bg);
    border: none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 15px;
    cursor: pointer;
    color: var(--text-main);
  }
  .shots-nav-btn:hover{ background: var(--border); }

  .modal-shots-track{
    display:flex;
    gap: 16px;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .modal-shots-track::-webkit-scrollbar{ display: none; }

  .modal-shot{
    flex: 0 0 auto;
    width: 220px;
    aspect-ratio: 9 / 16;
    border-radius: 18px;
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
  }
  .modal-shot img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .modal-shot .placeholder-icon{
    font-size: 26px;
    opacity: 0.8;
  }

  @media (max-width: 900px){
    .project-grid{ grid-template-columns: repeat(2,1fr); }
    .modal-info-grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 620px){
    .wrap{ padding: 40px 16px 110px; }
    .header h1{ font-size: 26px; }
    .project-grid{ grid-template-columns: 1fr; }
    .modal-card{ padding: 28px 20px 32px; }
    .modal-head{ flex-direction: column; padding-right: 0; }
    .modal-icon{ width: 72px; height: 72px; }
    .modal-title{ font-size: 24px; }
    .modal-info-grid{ grid-template-columns: 1fr 1fr; }
    .modal-shot{ width: 150px; }
  }
</style>

  // ---------- 필터 버튼 ----------
  const filterBtns = document.querySelectorAll('.filter-btn');
  const cards = document.querySelectorAll('.project-card');
  const grid = document.getElementById('projectGrid');

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const filter = btn.getAttribute('data-filter');
      let visibleCount = 0;

      cards.forEach(card => {
        const category = card.getAttribute('data-category');
        const match = filter === 'all' || category === filter;
        card.style.display = match ? '' : 'none';
        if (match) visibleCount++;
      });

      let noResult = grid.querySelector('.no-result');
      if (visibleCount === 0) {
        if (!noResult) {
          noResult = document.createElement('div');
          noResult.className = 'no-result';
          noResult.textContent = '해당하는 프로젝트가 아직 없어요.';
          grid.appendChild(noResult);
        }
      } else if (noResult) {
        noResult.remove();
      }
    });
  });

  // ---------- 모달 ----------
  const modalOverlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');
  const modalIcon = document.getElementById('modalIcon');
  const modalIconEmoji = document.getElementById('modalIconEmoji');
  const modalTags = document.getElementById('modalTags');
  const modalTitle = document.getElementById('modalTitle');
  const modalDesc = document.getElementById('modalDesc');
  const modalLinks = document.getElementById('modalLinks');
  const modalInfoGrid = document.getElementById('modalInfoGrid');
  const modalShotsTrack = document.getElementById('modalShotsTrack');
  const shotsPrev = document.getElementById('shotsPrev');
  const shotsNext = document.getElementById('shotsNext');

  function openModal(id){
    const data = projectData[id];
    if (!data) return;

    modalIcon.style.background = data.iconBg || '#ececee';
    modalIconEmoji.textContent = data.iconEmoji || '🖼️';

    modalTags.innerHTML = (data.tags || [])
      .map(tag => `<span class="modal-tag">${tag}</span>`).join('');

    modalTitle.textContent = data.title || '';
    modalDesc.textContent = data.description || '';

    modalLinks.innerHTML = (data.links || [])
      .map(link => `<a class="modal-link-btn" href="${link.url}" target="_blank" rel="noopener noreferrer">${link.label} ↗</a>`)
      .join('');

    modalInfoGrid.innerHTML = (data.info || [])
      .map(item => `
        <div class="modal-info-cell">
          <div class="modal-info-label">${item.label}</div>
          <div class="modal-info-value">${item.value}</div>
        </div>
      `).join('');

    const shots = (data.shots && data.shots.length) ? data.shots : [null, null, null];
    modalShotsTrack.innerHTML = shots.map(src => {
      if (src) {
        return `<div class="modal-shot" style="background:#18181b;"><img src="${src}" alt="${data.title} 스크린샷"></div>`;
      }
      return `<div class="modal-shot" style="background:${data.iconBg || '#ececee'};"><span class="placeholder-icon">📷</span></div>`;
    }).join('');

    modalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    modalOverlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  cards.forEach(card => {
    card.addEventListener('click', () => {
      const id = card.getAttribute('data-id');
      openModal(id);
    });
  });

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
  });

  shotsPrev.addEventListener('click', () => {
    modalShotsTrack.scrollBy({ left: -240, behavior: 'smooth' });
  });
  shotsNext.addEventListener('click', () => {
    modalShotsTrack.scrollBy({ left: 240, behavior: 'smooth' });
  });

  // ---------- 하단 About/Projects 탭 ----------
  document.querySelectorAll('.tabbar button').forEach(btn => {
    btn.addEventListener('click', () => {
      const tabName = btn.getAttribute('data-tab');
      document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (tabName === 'about') {
        window.location.href = './index.html';
      } else if (tabName === 'projects') {
        window.location.href = 'projects.html';
      }
    });
  });
</script>
