<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Car Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050508; font-family: 'Pretendard', sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }

    .font-orbitron { font-family: 'Orbitron', sans-serif; }

    /* Glassmorphism Styling */
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .neon-border {
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    /* Speedometer Glow */
    .gauge-glow {
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
    }

    /* Controls Touch Buttons */
    .touch-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
    }

    /* Custom Animations */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .animate-pulse-glow { animation: pulse-glow 2s infinite ease-in-out; }
  </style>
</head>
<body>

<!-- Screen Overlay UI Layer -->
<div id="ui-container" class="absolute inset-0 pointer-events-none z-10 flex flex-col justify-between p-4 md:p-6">

  <!-- Top Navigation & Controls Header -->
  <div class="flex justify-between items-start w-full">
    <!-- Compact Minimap Container (Relative Percent/VW Sizing) -->
    <div class="glass-panel p-1.5 rounded-xl pointer-events-auto flex flex-col items-center w-[12vw] h-[12vw] min-w-[75px] min-h-[75px] max-w-[120px] max-h-[120px]">
      <canvas id="minimap" class="w-full h-full rounded-lg bg-slate-900/80 border border-slate-700"></canvas>
      <div class="text-[9px] text-slate-400 font-bold mt-0.5 tracking-widest uppercase">GPS</div>
    </div>

    <!-- Top Right Dashboard Buttons -->
    <div class="flex flex-col gap-2 pointer-events-auto items-end">
      <div class="flex gap-2">
        <button id="btn-env" class="glass-panel hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition active:scale-95">
          <span id="env-icon">☀️</span> <span id="env-label">낮 (Day)</span>
        </button>
        <button id="btn-sound" class="glass-panel hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition active:scale-95">
          <span id="sound-icon">🔊</span> <span id="sound-label">엔진 음향 ON</span>
        </button>
        <button id="btn-camera" class="glass-panel hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition active:scale-95">
          🎥 시점 (C)
        </button>
      </div>

      <!-- Drift Points Counter Display -->
      <div id="drift-box" class="glass-panel px-4 py-2 rounded-xl text-right opacity-0 transition-opacity duration-300 border-amber-500/50">
        <div class="text-[10px] text-amber-400 font-bold tracking-wider">DRIFT SCORE</div>
        <div class="text-2xl font-black font-orbitron text-amber-300 flex items-center justify-end gap-1">
          +<span id="drift-score">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Center Notification Toast -->
  <div id="toast" class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-0 transition-all duration-300 transform scale-90">
    <div class="glass-panel neon-border px-6 py-3 rounded-2xl text-center">
      <div id="toast-title" class="text-lg font-black text-sky-400 font-orbitron">NITRO READY</div>
      <div id="toast-sub" class="text-xs text-slate-300 mt-0.5">Shift 키로 부스트 가속!</div>
    </div>
  </div>

  <!-- Bottom Controls & Digital HUD Cluster -->
  <div class="flex justify-between items-end w-full">

    <!-- Key Controls Legend (Desktop) -->
    <div class="hidden lg:block glass-panel p-4 rounded-2xl text-xs text-slate-300 space-y-1.5 border-slate-700/60 max-w-xs">
      <div class="font-bold text-sky-400 mb-1 flex items-center gap-1.5">
        🎮 조작법 가이드
      </div>
      <div class="flex justify-between gap-4"><span>가속 / 후진:</span><span class="font-mono text-amber-300">W / S (▲/▼)</span></div>
      <div class="flex justify-between gap-4"><span>조향:</span><span class="font-mono text-amber-300">A / D (◄/►)</span></div>
      <div class="flex justify-between gap-4"><span>핸드브레이크 / 드리프트:</span><span class="font-mono text-amber-300">Space</span></div>
      <div class="flex justify-between gap-4"><span>부스터 (Nitro):</span><span class="font-mono text-amber-300">Shift</span></div>
      <div class="flex justify-between gap-4"><span>카메라 시점 변경:</span><span class="font-mono text-amber-300">C</span></div>
      <div class="flex justify-between gap-4"><span>전조등 / 차량 리셋:</span><span class="font-mono text-amber-300">L / R</span></div>
    </div>

    <!-- Dashboard Gauge HUD -->
    <div class="glass-panel p-5 rounded-3xl flex items-center gap-6 border-sky-500/30 mx-auto lg:mx-0">
      <!-- Gear Box -->
      <div class="flex flex-col items-center justify-center border-r border-slate-700/80 pr-5">
        <div class="text-[10px] text-slate-400 font-bold tracking-widest">GEAR</div>
        <div id="hud-gear" class="text-4xl font-black font-orbitron text-sky-400">D</div>
      </div>

      <!-- Speedometer Digital Gauge -->
      <div class="flex flex-col items-center">
        <div class="flex items-baseline gap-1">
          <span id="hud-speed" class="text-5xl md:text-6xl font-black font-orbitron text-white tracking-tight gauge-glow">0</span>
          <span class="text-xs font-bold text-slate-400 font-orbitron">KM/H</span>
        </div>
        <!-- Nitro Gauge Bar -->
        <div class="w-36 h-2 bg-slate-800 rounded-full mt-2 overflow-hidden p-0.5 border border-slate-700">
          <div id="nitro-bar" class="h-full bg-gradient-to-r from-sky-500 to-indigo-500 rounded-full transition-all duration-100" style="width: 100%"></div>
        </div>
        <div class="text-[9px] text-sky-400 font-bold mt-1 font-orbitron tracking-widest">NITRO BOOST</div>
      </div>

      <!-- RPM Circle Bar -->
      <div class="hidden sm:flex flex-col items-center pl-4 border-l border-slate-700/80">
        <div class="text-[10px] text-slate-400 font-bold tracking-widest">ENGINE RPM</div>
        <div class="text-xl font-bold font-orbitron text-amber-400 mt-1"><span id="hud-rpm">800</span></div>
      </div>
    </div>

    <!-- Mobile Touch Steering Overlay (Shown on Mobile) -->
    <div class="lg:hidden pointer-events-auto flex gap-3">
      <div class="flex flex-col gap-2">
        <button id="touch-left" class="touch-btn w-14 h-14 rounded-2xl text-2xl font-bold text-white flex items-center justify-center">◀</button>
        <button id="touch-right" class="touch-btn w-14 h-14 rounded-2xl text-2xl font-bold text-white flex items-center justify-center">▶</button>
      </div>
      <div class="flex flex-col gap-2">
        <button id="touch-accel" class="touch-btn w-14 h-14 rounded-2xl text-xl font-bold text-emerald-400 flex items-center justify-center">GAS</button>
        <button id="touch-brake" class="touch-btn w-14 h-14 rounded-2xl text-xl font-bold text-rose-400 flex items-center justify-center">BRK</button>
      </div>
    </div>

  </div>
</div>

<!-- Start & Car Customization Menu Overlay -->
<div id="menu-overlay" class="absolute inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-xl p-6 transition-opacity duration-500">
  <div class="max-w-xl w-full glass-panel neon-border p-8 rounded-3xl text-center flex flex-col items-center">

    <div class="inline-block px-3 py-1 rounded-full bg-sky-500/10 border border-sky-400/30 text-sky-400 text-xs font-bold font-orbitron tracking-widest mb-4">
      3D DRIVING SIMULATOR
    </div>
    <h1 class="text-4xl md:text-5xl font-black text-white font-orbitron tracking-tight mb-2">
      CAR <span class="text-sky-400">SIMULATOR</span>
    </h1>
    <p class="text-sm text-slate-300 mb-8 font-medium">
      현실적 도심 오픈월드와 스포츠카 드라이빙 시뮬레이션
    </p>

    <!-- Vehicle Selection Cards -->
    <div class="w-full grid grid-cols-3 gap-3 mb-8">
      <button class="car-select-btn glass-panel p-3 rounded-2xl border-2 border-sky-400 bg-sky-500/10 text-white transition hover:scale-105" data-car="gt">
        <div class="text-2xl mb-1">🏎️</div>
        <div class="text-xs font-bold font-orbitron">GT SPORT</div>
        <div class="text-[10px] text-slate-400">균형잡힌 최고속도</div>
      </button>
      <button class="car-select-btn glass-panel p-3 rounded-2xl border-2 border-transparent text-slate-300 transition hover:scale-105" data-car="cyber">
        <div class="text-2xl mb-1">⚡</div>
        <div class="text-xs font-bold font-orbitron">CYBER EV</div>
        <div class="text-[10px] text-slate-400">폭발적인 가속력</div>
      </button>
      <button class="car-select-btn glass-panel p-3 rounded-2xl border-2 border-transparent text-slate-300 transition hover:scale-105" data-car="suv">
        <div class="text-2xl mb-1">🚙</div>
        <div class="text-xs font-bold font-orbitron">OFFROAD 4X4</div>
        <div class="text-[10px] text-slate-400">강력한 파워 & 차체</div>
      </button>
    </div>

    <!-- Start Engine Button -->
    <button id="btn-start-game" class="w-full py-4 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-black font-orbitron text-lg tracking-wider shadow-lg shadow-sky-500/25 transition active:scale-95">
      START ENGINE (주행 시작)
    </button>
  </div>
</div>

<script>
  // Audio Synthesizer Class for Engine, Screech and Nitro Sound
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.osc = null;
      this.subOsc = null;
      this.filter = null;
      this.gain = null;
      this.screechOsc = null;
      this.screechGain = null;
      this.enabled = true;
      this.initialized = false;
    }

    init() {
      if (this.initialized) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        // Main Engine Intake & Exhaust Oscillators
        this.osc = this.ctx.createOscillator();
        this.osc.type = 'sawtooth';

        this.subOsc = this.ctx.createOscillator();
        this.subOsc.type = 'triangle';

        // Low-pass Filter to strip off harsh bee-like high frequencies
        this.filter = this.ctx.createBiquadFilter();
        this.filter.type = 'lowpass';
        this.filter.frequency.setValueAtTime(160, this.ctx.currentTime);
        this.filter.Q.setValueAtTime(2.5, this.ctx.currentTime);

        this.gain = this.ctx.createGain();
        this.gain.gain.setValueAtTime(0.0, this.ctx.currentTime);

        // Connect rumble audio path
        this.osc.connect(this.filter);
        this.subOsc.connect(this.filter);
        this.filter.connect(this.gain);
        this.gain.connect(this.ctx.destination);

        this.osc.start();
        this.subOsc.start();

        // Tire Screeching Noise Synthesizer with Bandpass filter
        this.screechOsc = this.ctx.createOscillator();
        this.screechGain = this.ctx.createGain();
        this.screechOsc.type = 'sawtooth';
        this.screechOsc.frequency.setValueAtTime(750, this.ctx.currentTime);

        const screechFilter = this.ctx.createBiquadFilter();
        screechFilter.type = 'bandpass';
        screechFilter.frequency.setValueAtTime(1200, this.ctx.currentTime);
        screechFilter.Q.setValueAtTime(2.0, this.ctx.currentTime);

        this.screechGain.gain.setValueAtTime(0.0, this.ctx.currentTime);
        this.screechOsc.connect(screechFilter);
        screechFilter.connect(this.screechGain);
        this.screechGain.connect(this.ctx.destination);
        this.screechOsc.start();

        this.initialized = true;
      } catch(e) { console.warn("Audio init failed", e); }
    }

    update(speed, rpm, isDrifting, isAccel) {
      if (!this.initialized || !this.enabled || !this.ctx) return;
      if (this.ctx.state === 'suspended') { this.ctx.resume(); }

      // Low bass engine pitch (28Hz - 90Hz) for realistic deep engine roar
      const baseFreq = 28 + (rpm / 8000) * 65;
      this.osc.frequency.setTargetAtTime(baseFreq, this.ctx.currentTime, 0.05);
      this.subOsc.frequency.setTargetAtTime(baseFreq * 0.5, this.ctx.currentTime, 0.05);

      // Dynamic filter cutoff removes buzzing noise while allowing deep exhaust tone
      const filterCutoff = 130 + (rpm / 8000) * 450;
      this.filter.frequency.setTargetAtTime(filterCutoff, this.ctx.currentTime, 0.05);

      const engineVol = isAccel ? 0.22 : 0.08;
      this.gain.gain.setTargetAtTime(engineVol, this.ctx.currentTime, 0.05);

      // Tire Screeching volume when drifting
      const screechVol = isDrifting && speed > 20 ? 0.05 : 0.0;
      this.screechGain.gain.setTargetAtTime(screechVol, this.ctx.currentTime, 0.05);
    }

    toggle() {
      this.enabled = !this.enabled;
      if (!this.enabled && this.gain) {
        this.gain.gain.setValueAtTime(0, this.ctx.currentTime);
        this.screechGain.gain.setValueAtTime(0, this.ctx.currentTime);
      }
      return this.enabled;
    }
  }

  const audioSys = new SoundEngine();

  // Game Configuration & State
  const State = {
    isPlaying: false,
    selectedCar: 'gt',
    envMode: 'day', // 'day', 'sunset', 'night'
    cameraMode: 0,  // 0: Third Person Chase, 1: Cockpit Hood View, 2: Top Down

    // Physics variables
    speed: 0,
    rpm: 800,
    steering: 0,
    angle: 0,
    posX: 0,
    posZ: 0,
    gear: 'D',
    nitro: 100,
    isBoosting: false,
    isDrifting: false,
    driftScore: 0,
    totalDriftScore: 0,
    headlightsOn: false
  };

  const CarConfigs = {
    gt: { name: 'GT Sport', maxSpeed: 210, accel: 0.85, handling: 0.042, color: 0xef4444, brake: 0.96 },
    cyber: { name: 'Cyber EV', maxSpeed: 240, accel: 1.1, handling: 0.048, color: 0x06b6d4, brake: 0.95 },
    suv: { name: 'Offroad 4x4', maxSpeed: 170, accel: 0.7, handling: 0.035, color: 0x10b981, brake: 0.97 }
  };

  const Input = { forward: false, backward: false, left: false, right: false, drift: false, nitro: false };

  // Three.js Core Setup Variables
  let scene, camera, renderer;
  let carGroup, bodyMesh, wheels = [];
  let headlightLights = [], underglowLight = null;
  let environmentObjects = [];
  let minimapCtx;
  let particleSystem, particleGeo, particleMat;
  const particleCount = 100;

  window.addEventListener('load', () => {
    initThree();
    initEnvironment();
    buildCarMesh(State.selectedCar);
    setupUIAndEvents();
    initMinimap();
    animate();
  });

  function initThree() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.0015);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    // Directional Sunlight & Ambient Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    ambientLight.name = "ambientLight";
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.3);
    sunLight.position.set(120, 200, 100);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 500;
    const d = 180;
    sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
    sunLight.name = "sunLight";
    scene.add(sunLight);

    // Particles for Drift Smoke
    particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for(let i=0; i<particleCount*3; i++) positions[i] = 0;
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    particleMat = new THREE.PointsMaterial({
      color: 0xcccccc,
      size: 1.2,
      transparent: true,
      opacity: 0,
      depthWrite: false
    });
    particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);
  }

  function initEnvironment() {
    // Ground Road Plane Texture
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#334155'; ctx.fillRect(0, 0, 1024, 1024);

    // Road Grid Lines
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 6; ctx.setLineDash([40, 40]);
    for (let i = 128; i < 1024; i += 256) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 1024); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke();
    }

    const groundTex = new THREE.CanvasTexture(canvas);
    groundTex.wrapS = THREE.RepeatWrapping; groundTex.wrapT = THREE.RepeatWrapping;
    groundTex.repeat.set(40, 40);

    const groundGeo = new THREE.PlaneGeometry(2000, 2000);
    const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.8, metalness: 0.2 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Procedural City Buildings & Decor
    const bldgGeo = new THREE.BoxGeometry(1, 1, 1);
    const colors = [0x1e293b, 0x0f172a, 0x334155, 0x475569];

    for (let i = 0; i < 140; i++) {
      let bx = (Math.random() - 0.5) * 1200;
      let bz = (Math.random() - 0.5) * 1200;

      // Keep road clearing
      if (Math.abs(bx % 256) < 40 || Math.abs(bz % 256) < 40) continue;
      if (Math.abs(bx) < 60 && Math.abs(bz) < 60) continue;

      let bw = 25 + Math.random() * 35;
      let bd = 25 + Math.random() * 35;
      let bh = 40 + Math.random() * 180;

      let bMat = new THREE.MeshStandardMaterial({
        color: colors[Math.floor(Math.random() * colors.length)],
        roughness: 0.3, metalness: 0.5
      });

      let building = new THREE.Mesh(bldgGeo, bMat);
      building.scale.set(bw, bh, bd);
      building.position.set(bx, bh / 2, bz);
      building.castShadow = true; building.receiveShadow = true;
      scene.add(building);
      environmentObjects.push({ x: bx, z: bz, radius: Math.max(bw, bd) / 2 + 1.5 });
    }

    // Stunt Jump Ramps
    createRamp(0, 150, 0);
    createRamp(256, -100, Math.PI / 2);
  }

  function createRamp(x, z, rot) {
    const rampGeo = new THREE.BoxGeometry(12, 3, 20);
    const rampMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.5 });
    const ramp = new THREE.Mesh(rampGeo, rampMat);
    ramp.position.set(x, 1.5, z);
    ramp.rotation.y = rot;
    ramp.rotation.x = -0.2;
    ramp.castShadow = true; ramp.receiveShadow = true;
    scene.add(ramp);
  }

  function buildCarMesh(type) {
    if (carGroup) scene.remove(carGroup);

    carGroup = new THREE.Group();
    wheels = []; headlightLights = [];

    const config = CarConfigs[type];

    // Detailed Chassis Body
    const bodyGeo = new THREE.BoxGeometry(2.1, 0.75, 4.4);
    const bodyMat = new THREE.MeshStandardMaterial({
      color: config.color,
      metalness: 0.8,
      roughness: 0.2
    });
    bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyMesh.position.y = 0.65;
    bodyMesh.castShadow = true;
    carGroup.add(bodyMesh);

    // Car Cabin Glass
    const cabinGeo = new THREE.BoxGeometry(1.8, 0.6, 2.2);
    const cabinMat = new THREE.MeshPhysicalMaterial({
      color: 0x0f172a,
      metalness: 0.9,
      roughness: 0.1,
      transmission: 0.5,
      transparent: true
    });
    const cabin = new THREE.Mesh(cabinGeo, cabinMat);
    cabin.position.set(0, 1.25, -0.2);
    cabin.castShadow = true;
    carGroup.add(cabin);

    // LED Headlights
    const headMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const hlL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.1), headMat);
    hlL.position.set(0.7, 0.65, 2.22);
    const hlR = hlL.clone();
    hlR.position.x = -0.7;
    carGroup.add(hlL); carGroup.add(hlR);

    // Light Beams
    for (let i = -1; i <= 1; i += 2) {
      const spot = new THREE.SpotLight(0xffffff, 0, 80, Math.PI / 6, 0.5);
      spot.position.set(i * 0.7, 0.65, 2.2);
      spot.target.position.set(i * 0.7, 0, 20);
      carGroup.add(spot);
      carGroup.add(spot.target);
      headlightLights.push(spot);
    }

    // Tail Lights
    const tailMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
    const tail = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.12, 0.1), tailMat);
    tail.position.set(0, 0.7, -2.22);
    carGroup.add(tail);

    // Sports Wheels
    const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.3, 24);
    wheelGeo.rotateZ(Math.PI / 2);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.8 });

    const wheelPos = [
      { x: 1.05, y: 0.42, z: 1.3 },
      { x: -1.05, y: 0.42, z: 1.3 },
      { x: 1.05, y: 0.42, z: -1.3 },
      { x: -1.05, y: 0.42, z: -1.3 }
    ];

    wheelPos.forEach(p => {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.position.set(p.x, p.y, p.z);
      w.castShadow = true;
      carGroup.add(w);
      wheels.push(w);
    });

    // Cyber Underglow Neon Light
    underglowLight = new THREE.PointLight(config.color, 0, 10);
    underglowLight.position.set(0, 0.2, 0);
    carGroup.add(underglowLight);

    scene.add(carGroup);
    updateEnvironmentLighting();
  }

  function setupUIAndEvents() {
    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Keyboard Control Listeners
    window.addEventListener('keydown', (e) => {
      switch(e.code) {
        case 'KeyW': case 'ArrowUp': Input.forward = true; break;
        case 'KeyS': case 'ArrowDown': Input.backward = true; break;
        case 'KeyA': case 'ArrowLeft': Input.left = true; break;
        case 'KeyD': case 'ArrowRight': Input.right = true; break;
        case 'Space': Input.drift = true; break;
        case 'ShiftLeft': case 'ShiftRight': Input.nitro = true; break;
        case 'KeyC': toggleCamera(); break;
        case 'KeyL': toggleHeadlights(); break;
        case 'KeyR': resetCarPosition(); break;
      }
    });

    window.addEventListener('keyup', (e) => {
      switch(e.code) {
        case 'KeyW': case 'ArrowUp': Input.forward = false; break;
        case 'KeyS': case 'ArrowDown': Input.backward = false; break;
        case 'KeyA': case 'ArrowLeft': Input.left = false; break;
        case 'KeyD': case 'ArrowRight': Input.right = false; break;
        case 'Space': Input.drift = false; break;
        case 'ShiftLeft': case 'ShiftRight': Input.nitro = false; break;
      }
    });

    // UI Buttons Action Setup
    document.getElementById('btn-start-game').addEventListener('click', () => {
      audioSys.init();
      State.isPlaying = true;
      document.getElementById('menu-overlay').style.opacity = '0';
      setTimeout(() => document.getElementById('menu-overlay').style.display = 'none', 500);
    });

    document.querySelectorAll('.car-select-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.car-select-btn').forEach(b => {
          b.classList.remove('border-sky-400', 'bg-sky-500/10', 'text-white');
          b.classList.add('border-transparent', 'text-slate-300');
        });
        const target = e.currentTarget;
        target.classList.remove('border-transparent', 'text-slate-300');
        target.classList.add('border-sky-400', 'bg-sky-500/10', 'text-white');

        State.selectedCar = target.dataset.car;
        buildCarMesh(State.selectedCar);
      });
    });

    document.getElementById('btn-env').addEventListener('click', toggleEnvironment);
    document.getElementById('btn-sound').addEventListener('click', () => {
      const active = audioSys.toggle();
      document.getElementById('sound-icon').innerText = active ? '🔊' : '🔇';
      document.getElementById('sound-label').innerText = active ? '엔진 음향 ON' : '음향 OFF';
    });
    document.getElementById('btn-camera').addEventListener('click', toggleCamera);

    // Touch Control Handlers (Mobile)
    setupTouchBtn('touch-accel', 'forward');
    setupTouchBtn('touch-brake', 'backward');
    setupTouchBtn('touch-left', 'left');
    setupTouchBtn('touch-right', 'right');
  }

  function setupTouchBtn(id, key) {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); Input[key] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); Input[key] = false; });
  }

  function toggleEnvironment() {
    if (State.envMode === 'day') State.envMode = 'sunset';
    else if (State.envMode === 'sunset') State.envMode = 'night';
    else State.envMode = 'day';

    const labels = { day: '☀️ 낮 (Day)', sunset: '🌅 노을 (Sunset)', night: '🌙 야경 (Night)' };
    document.getElementById('env-label').innerText = labels[State.envMode];
    updateEnvironmentLighting();
  }

  function updateEnvironmentLighting() {
    const ambient = scene.getObjectByName('ambientLight');
    const sun = scene.getObjectByName('sunLight');

    if (State.envMode === 'day') {
      scene.background.setHex(0x87ceeb);
      scene.fog.color.setHex(0x87ceeb);
      if (ambient) ambient.intensity = 0.7;
      if (sun) { sun.intensity = 1.3; sun.color.setHex(0xfffbeb); }
      State.headlightsOn = false;
    } else if (State.envMode === 'sunset') {
      scene.background.setHex(0xf97316);
      scene.fog.color.setHex(0xf97316);
      if (ambient) ambient.intensity = 0.4;
      if (sun) { sun.intensity = 0.8; sun.color.setHex(0xfdba74); }
      State.headlightsOn = true;
    } else {
      scene.background.setHex(0x020617);
      scene.fog.color.setHex(0x020617);
      if (ambient) ambient.intensity = 0.15;
      if (sun) { sun.intensity = 0.1; sun.color.setHex(0x38bdf8); }
      State.headlightsOn = true;
    }

    headlightLights.forEach(l => l.intensity = State.headlightsOn ? 2.5 : 0);
    if (underglowLight) underglowLight.intensity = State.envMode === 'night' ? 2 : 0;
  }

  function toggleHeadlights() {
    State.headlightsOn = !State.headlightsOn;
    headlightLights.forEach(l => l.intensity = State.headlightsOn ? 2.5 : 0);
  }

  function toggleCamera() {
    State.cameraMode = (State.cameraMode + 1) % 3;
  }

  function resetCarPosition() {
    State.posX = 0; State.posZ = 0;
    State.angle = 0; State.speed = 0;
    showToast("차량 위치 리셋됨", "중앙 도로로 복귀했습니다.");
  }

  function showToast(title, sub) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-title').innerText = title;
    document.getElementById('toast-sub').innerText = sub;
    toast.style.opacity = '1';
    toast.style.transform = 'translate(-50%, -50%) scale(1)';
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translate(-50%, -50%) scale(0.9)';
    }, 2000);
  }

  function initMinimap() {
    const canvas = document.getElementById('minimap');
    canvas.width = canvas.clientWidth || 90;
    canvas.height = canvas.clientHeight || 90;
    minimapCtx = canvas.getContext('2d');
  }

  function drawMinimap() {
    if (!minimapCtx) return;
    const canvas = document.getElementById('minimap');
    if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }

    const ctx = minimapCtx;
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Draw center background radar
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, w, h);

    const scale = 0.1;
    const cx = w / 2, cy = h / 2;

    // Draw Buildings on minimap
    ctx.fillStyle = '#334155';
    environmentObjects.forEach(obj => {
      let mx = cx + (obj.x - State.posX) * scale;
      let my = cy + (obj.z - State.posZ) * scale;
      if (mx > 0 && mx < w && my > 0 && my < h) {
        ctx.beginPath();
        ctx.arc(mx, my, Math.max(1.5, obj.radius * scale), 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // Draw Player Arrow
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-State.angle);
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(0, -5);
    ctx.lineTo(4, 4);
    ctx.lineTo(-4, 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function updatePhysics() {
    if (!State.isPlaying) return;

    const config = CarConfigs[State.selectedCar];

    // Acceleration & Nitro Physics
    let currentAccel = config.accel;
    if (Input.nitro && State.nitro > 5) {
      currentAccel *= 1.8;
      State.nitro = Math.max(0, State.nitro - 0.8);
      State.isBoosting = true;
    } else {
      State.nitro = Math.min(100, State.nitro + 0.15);
      State.isBoosting = false;
    }

    if (Input.forward) {
      State.speed += currentAccel;
      State.gear = 'D';
    } else if (Input.backward) {
      State.speed -= currentAccel * 0.7;
      if (State.speed < 0) State.gear = 'R';
    } else {
      State.speed *= 0.98; // Natural friction drag
    }

    // Top speed clamp
    const maxSpd = State.isBoosting ? config.maxSpeed * 1.25 : config.maxSpeed;
    State.speed = Math.max(-config.maxSpeed * 0.3, Math.min(maxSpd, State.speed));

    // Steering & Drift Physics
    const steerSensitivity = config.handling * (1 - Math.min(Math.abs(State.speed) / 300, 0.5));
    if (Input.left) State.steering = Math.min(0.6, State.steering + steerSensitivity);
    else if (Input.right) State.steering = Math.max(-0.6, State.steering - steerSensitivity);
    else State.steering *= 0.82;

    // Drift Mechanics
    if (Input.drift && Math.abs(State.speed) > 40) {
      State.speed *= config.brake;
      State.isDrifting = true;
      State.angle += State.steering * 0.055;

      // Accumulate Drift Points
      const pts = Math.floor(Math.abs(State.speed * State.steering) * 0.5);
      State.driftScore += pts;
      State.totalDriftScore += pts;
    } else {
      State.isDrifting = false;
      State.angle += State.steering * (State.speed / 1200);
    }

    // Position Translation
    const moveDist = State.speed * 0.016;
    State.posX += Math.sin(State.angle) * moveDist;
    State.posZ += Math.cos(State.angle) * moveDist;

    // Building Collision
    environmentObjects.forEach(obj => {
      const dx = State.posX - obj.x;
      const dz = State.posZ - obj.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < obj.radius) {
        State.speed = -State.speed * 0.4; // Bounce back
        State.posX += (dx / dist) * 0.5;
        State.posZ += (dz / dist) * 0.5;
      }
    });

    // Update Car Model Transform
    if (carGroup) {
      carGroup.position.set(State.posX, 0, State.posZ);
      carGroup.rotation.y = State.angle;

      // Wheel rotation animation
      wheels.forEach((w, idx) => {
        w.rotation.x += moveDist * 0.8;
        if (idx < 2) w.rotation.y = State.steering * 0.6; // Front wheel steer
      });
    }

    // Engine Audio Update
    State.rpm = 800 + Math.abs(State.speed) * 32;
    audioSys.update(Math.abs(State.speed), State.rpm, State.isDrifting, Input.forward);

    // Update Particle Drift Smoke Effect
    updateParticles();

    // Camera Tracking
    updateCamera();

    // Update HUD UI Elements
    updateHUD();
  }

  function updateParticles() {
    if (!particleGeo) return;
    const positions = particleGeo.attributes.position.array;

    if (State.isDrifting) {
      particleMat.opacity = 0.6;
      const pIdx = Math.floor(Math.random() * particleCount) * 3;
      positions[pIdx] = State.posX - Math.sin(State.angle) * 1.5;
      positions[pIdx + 1] = 0.3;
      positions[pIdx + 2] = State.posZ - Math.cos(State.angle) * 1.5;
    } else {
      particleMat.opacity = Math.max(0, particleMat.opacity - 0.05);
    }
    particleGeo.attributes.position.needsUpdate = true;
  }

  function updateCamera() {
    if (!carGroup) return;

    if (State.cameraMode === 0) { // Third-Person Smooth Chase
      const dist = 9.5 + (State.speed / 80);
      const height = 3.8;
      const targetX = State.posX - Math.sin(State.angle) * dist;
      const targetZ = State.posZ - Math.cos(State.angle) * dist;

      camera.position.x += (targetX - camera.position.x) * 0.12;
      camera.position.y += (height - camera.position.y) * 0.12;
      camera.position.z += (targetZ - camera.position.z) * 0.12;
      camera.lookAt(State.posX, 1.2, State.posZ);

    } else if (State.cameraMode === 1) { // First Person Cockpit Hood
      const hoodX = State.posX + Math.sin(State.angle) * 0.3;
      const hoodZ = State.posZ + Math.cos(State.angle) * 0.3;
      camera.position.set(hoodX, 1.35, hoodZ);
      const lookX = State.posX + Math.sin(State.angle) * 20;
      const lookZ = State.posZ + Math.cos(State.angle) * 20;
      camera.lookAt(lookX, 1.2, lookZ);

    } else { // Top Down Helicopter Cam
      camera.position.set(State.posX, 45, State.posZ);
      camera.lookAt(State.posX, 0, State.posZ);
    }
  }

  function updateHUD() {
    document.getElementById('hud-speed').innerText = Math.floor(Math.abs(State.speed));
    document.getElementById('hud-rpm').innerText = Math.floor(State.rpm);
    document.getElementById('hud-gear').innerText = State.gear;
    document.getElementById('nitro-bar').style.width = `${State.nitro}%`;

    // Drift Score Overlay
    const driftBox = document.getElementById('drift-box');
    if (State.isDrifting) {
      driftBox.style.opacity = '1';
      document.getElementById('drift-score').innerText = State.driftScore;
    } else {
      if (State.driftScore > 0) {
        setTimeout(() => {
          driftBox.style.opacity = '0';
          State.driftScore = 0;
        }, 1200);
      }
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    updatePhysics();
    drawMinimap();
    renderer.render(scene, camera);
  }
</script>
</body>
