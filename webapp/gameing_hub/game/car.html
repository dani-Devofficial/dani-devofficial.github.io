  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050508; font-family: 'Pretendard', sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }

      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(16px);

      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3), inset 0 0 10px rgba(56, 189, 248, 0.2);

    }

      background: rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(10px);
      transition: all 0.1s ease;
    }
    .touch-btn:active {
      transform: scale(0.9);

    }
  </style>

<script>
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.osc = null;
      this.subOsc = null;
      this.filter = null;
      this.gain = null;
      this.screechOsc = null;
      this.screechGain = null;
      this.enabled = true;
      this.initialized = false;
    }

    init() {
      if (this.initialized) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        this.osc = this.ctx.createOscillator();
        this.osc.type = 'sawtooth';

        this.subOsc = this.ctx.createOscillator();
        this.subOsc.type = 'triangle';

        this.filter = this.ctx.createBiquadFilter();
        this.filter.type = 'lowpass';
        this.filter.frequency.setValueAtTime(160, this.ctx.currentTime);
        this.filter.Q.setValueAtTime(2.5, this.ctx.currentTime);

        this.gain = this.ctx.createGain();
        this.gain.gain.setValueAtTime(0.0, this.ctx.currentTime);

        this.osc.connect(this.filter);
        this.subOsc.connect(this.filter);
        this.filter.connect(this.gain);
        this.gain.connect(this.ctx.destination);

        this.osc.start();
        this.subOsc.start();

        this.screechOsc = this.ctx.createOscillator();
        this.screechGain = this.ctx.createGain();
        this.screechOsc.type = 'sawtooth';
        this.screechOsc.frequency.setValueAtTime(900, this.ctx.currentTime);

        const screechFilter = this.ctx.createBiquadFilter();
        screechFilter.type = 'bandpass';
        screechFilter.frequency.setValueAtTime(1500, this.ctx.currentTime);
        screechFilter.Q.setValueAtTime(3.5, this.ctx.currentTime);

        this.screechGain.gain.setValueAtTime(0.0, this.ctx.currentTime);
        this.screechOsc.connect(screechFilter);
        screechFilter.connect(this.screechGain);
        screechGain.connect(this.ctx.destination);
        this.screechOsc.start();

        this.initialized = true;
      } catch(e) { console.warn("Audio init failed", e); }
    }

    update(speed, rpm, isDrifting, isAccel) {
      if (!this.initialized || !this.enabled || !this.ctx) return;
      if (this.ctx.state === 'suspended') { this.ctx.resume(); }

      const baseFreq = 35 + (rpm / 8000) * 85;
      this.osc.frequency.setTargetAtTime(baseFreq, this.ctx.currentTime, 0.05);
      this.subOsc.frequency.setTargetAtTime(baseFreq * 0.4, this.ctx.currentTime, 0.05);

      const filterCutoff = 150 + (rpm / 8000) * 850;
      this.filter.frequency.setTargetAtTime(filterCutoff, this.ctx.currentTime, 0.05);

      const engineVol = isAccel ? 0.25 : 0.1;
      this.gain.gain.setTargetAtTime(engineVol, this.ctx.currentTime, 0.05);

      const screechVol = (isDrifting && speed > 25) ? 0.12 + Math.random()*0.03 : 0.0;
      this.screechGain.gain.setTargetAtTime(screechVol, this.ctx.currentTime, 0.05);
    }

    toggle() {
      this.enabled = !this.enabled;
      if (!this.enabled && this.gain) {
        this.gain.gain.setValueAtTime(0, this.ctx.currentTime);
        this.screechGain.gain.setValueAtTime(0, this.ctx.currentTime);
      }
      return this.enabled;
    }
  }

  const audioSys = new SoundEngine();

  const State = {
    isPlaying: false,
    selectedCar: 'cybertruck',
    envMode: 'day',
    cameraMode: 0,

    speed: 0,
    rpm: 800,
    steering: 0,
    angle: 0, // 0 means facing +Z direction in Three.js world, but player drives +X or +Z ? Actually 0 angle means forward in +Z in this code's math
    posX: 0,
    posY: 0, // Added posY for sidewalk bump
    posZ: 0,
    gear: 'D',

    battery: 100,

    isDrifting: false,
    driftScore: 0,
    totalDriftScore: 0,
    headlightsOn: false

    const CarConfigs = {

  const Input = { forward: false, backward: false, left: false, right: false, drift: false, nitro: false };

  let scene, camera, renderer;
  let carGroup, carBodyMesh, wheels = [];
  let headlightLights = [], tailLights = [], underglowLight = null;
  let minimapCtx;

  let particleSystem, particleGeo, particleMat;

  // Skid Marks System
  const MAX_SKID_MARKS = 300;

  // Infinite City Specs
  const BLOCK_SIZE = 120;
  const ROAD_WIDTH = 32;
  const BUILDING_SPACE = BLOCK_SIZE - ROAD_WIDTH;
  let groundPlane;
  let bldgMeshes = [];
  let sidewalkMesh = null;
  const INSTANCE_GRID_RADIUS = 10;
  const MAX_INSTANCES = (INSTANCE_GRID_RADIUS * 2 + 1) * (INSTANCE_GRID_RADIUS * 2 + 1);
  let lastBlockX = -999, lastBlockZ = -999;
  let activeColliders = [];
  let sidewalkAreas = []; // To track sidewalk areas for bump logic

  // NPC Traffic System Variables
  const npcCars = [];

  window.addEventListener('load', () => {
    initThree();
    initInfiniteCity();
    initSkidMarkPool();
    initNPCCars();
    buildHighPolyCar(State.selectedCar);
    setupUIAndEvents();
    initMinimap();

  function initThree() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.002);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 1500);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    ambientLight.name = "ambientLight";
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.5);
    sunLight.position.set(200, 300, 150);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 800;
    const d = 250;
    sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005;
    sunLight.name = "sunLight";
    scene.add(sunLight);

    // Enhanced Drift Smoke Particle System
    particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const opacities = new Float32Array(particleCount);
    for(let i = 0; i < particleCount; i++) {
      positions[i*3] = 0; positions[i*3+1] = -999; positions[i*3+2] = 0;
      opacities[i] = 0;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));

    particleMat = new THREE.PointsMaterial({
      color: 0xeeeeee, size: 4.5, transparent: true, opacity: 0.7,
      depthWrite: false, map: createSmokeTexture(), blending: THREE.NormalBlending
    });
    particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);
  }

  function createSmokeTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.5, 'rgba(200,200,200,0.5)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(canvas);
  }

  function seededRandom(x, z) {
    const dot = x * 12.9898 + z * 78.233;
    const sn = Math.sin(dot) * 43758.5453;
    return sn - Math.floor(sn);
  }

  function generateRoadTexture() {
    const canvas = document.createElement('canvas');
    const size = 1024;
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#1b222d';
    ctx.fillRect(0, 0, size, size);
    for(let i=0; i<40000; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? '#111827' : '#2d3748';
      ctx.fillRect(Math.random()*size, Math.random()*size, 2, 2);
    }
    const roadPx = (ROAD_WIDTH / BLOCK_SIZE) * size;
    const offset = (size - roadPx) / 2;

    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 6;
    ctx.strokeRect(offset, offset, size - offset*2, size - offset*2);

    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 5;
    ctx.setLineDash([35, 35]);
    ctx.beginPath(); ctx.moveTo(0, size/2); ctx.lineTo(size, size/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(size/2, 0); ctx.lineTo(size/2, size); ctx.stroke();

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  function generateSidewalkTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#64748b';
    ctx.fillRect(0, 0, 512, 512);
    const tileSize = 32;
    ctx.lineWidth = 2;

    for (let x = 0; x < 512; x += tileSize) {
      for (let y = 0; y < 512; y += tileSize) {
        const v = Math.floor(180 + Math.random() * 25);
        ctx.fillStyle = `rgb(${v},${v+5},${v+10})`;
        ctx.fillRect(x, y, tileSize, tileSize);
        ctx.strokeStyle = '#475569';
        ctx.strokeRect(x, y, tileSize, tileSize);
      }
    }

    const curbW = 16;
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(0, 0, 512, curbW);
    ctx.fillRect(0, 512 - curbW, 512, curbW);
    ctx.fillRect(0, 0, curbW, 512);
    ctx.fillRect(512 - curbW, 0, curbW, 512);

    ctx.fillStyle = '#ffffff';
    for(let i=0; i<512; i+=64) {
      ctx.fillRect(i, 0, 32, curbW); ctx.fillRect(i, 512-curbW, 32, curbW);
      ctx.fillRect(0, i, curbW, 32); ctx.fillRect(512-curbW, i, curbW, 32);
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(4, 4);
    return tex;
  }

  function generateBuildingTexture(type) {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');

    if (type === 0) ctx.fillStyle = '#0f172a';
    else if (type === 1) ctx.fillStyle = '#334155';
    else ctx.fillStyle = '#1e1b4b';
    ctx.fillRect(0,0,512,512);

    const rows = 12; const cols = 12;
    const wWidth = 25; const wHeight = 30;
    const spacingX = (512 - (cols * wWidth)) / (cols + 1);
    const spacingY = (512 - (rows * wHeight)) / (rows + 1);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = spacingX + c * (wWidth + spacingX);
        const y = spacingY + r * (wHeight + spacingY);

        let light = Math.random();
        if (light > 0.8) { ctx.fillStyle = '#fef08a'; ctx.shadowBlur = 10; ctx.shadowColor = '#fef08a'; }
        else if (light > 0.6) { ctx.fillStyle = '#bae6fd'; ctx.shadowBlur = 5; ctx.shadowColor = '#bae6fd'; }
        else { ctx.fillStyle = '#020617'; ctx.shadowBlur = 0; }

        if (type === 1) { ctx.fillRect(0, y, 512, wHeight); break; }
        else { ctx.fillRect(x, y, wWidth, wHeight); }
      }
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(2, 4);
    return tex;
  }

  // 새로운 NPC 트래픽 자동차 시스템
  function initNPCCars() {
    const colors = [0xffffff, 0xef4444, 0x3b82f6, 0xf59e0b, 0x10b981, 0x8b5cf6];

    for (let i = 0; i < MAX_NPC_CARS; i++) {
      const group = new THREE.Group();

      // 바디

      group.add(body);

      // 유리창 (캐빈)
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
      const cabinGeo = new THREE.BoxGeometry(1.6, 0.6, 2.0);
      cabinGeo.translate(0, 1.2, -0.2);
      const cabin = new THREE.Mesh(cabinGeo, glassMat);
      group.add(cabin);

      // 전조등 (밤에 빛나게)

      const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.1), hlMat);
      hl1.position.set(0.6, 0.6, 2.05); group.add(hl1);
      const hl2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.1), hlMat);
      hl2.position.set(-0.6, 0.6, 2.05); group.add(hl2);

      // 바퀴
      const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
      wheelGeo.rotateZ(Math.PI / 2);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

      const wPos = [[0.95, 0.35, 1.2], [-0.95, 0.35, 1.2], [0.95, 0.35, -1.2], [-0.95, 0.35, -1.2]];
      wPos.forEach(pos => {
        const w = new THREE.Mesh(wheelGeo, wheelMat);
        w.position.set(...pos);
        group.add(w);
      });

      scene.add(group);

      npcCars.push({
        mesh: group,
        lights: [hl1, hl2],
        x: 0, z: 0, angle: 0,
        speed: 30 + Math.random() * 20, // 랜덤한 속도 (30 ~ 50km/h)
        active: false,
        headlightsOn: false,
        isVertical: true, // X축 이동인지 Z축 이동인지 추적
        laneOffset: 0
      });

  }

  function updateNPCCars() {
    if (!State.isPlaying) return;
    const moveDist = 0.016; // 대략적인 60fps 시간 델타
    const isNight = (State.envMode === 'night' || State.envMode === 'sunset');
    
    // 차선 오프셋 계산 (도로의 정중앙 0기준으로 우측/좌측 차선)
    // 도로 폭(ROAD_WIDTH)이 32이므로 중앙에서 양쪽으로 약 8만큼 떨어지게 설정
    const rightLaneOffset = ROAD_WIDTH * 0.25; 
    const leftLaneOffset = -ROAD_WIDTH * 0.25;

    npcCars.forEach(npc => {
      // NPC 재생성 로직 (너무 멀어지거나 아직 활성화 안된 경우)
      if (!npc.active) {
        // 플레이어 주변 무작위 블록으로 스폰 위치 결정
        const bx = Math.floor(State.posX / BLOCK_SIZE) + (Math.floor(Math.random() * 5) - 2);
        const bz = Math.floor(State.posZ / BLOCK_SIZE) + (Math.floor(Math.random() * 5) - 2);

        npc.isVertical = Math.random() > 0.5;
        const isRightLane = Math.random() > 0.5;
        npc.laneOffset = isRightLane ? rightLaneOffset : leftLaneOffset;
        
        // 도로의 위치는 블록의 경계선(0, BLOCK_SIZE, 2*BLOCK_SIZE ...)에 위치함
        // 따라서 도로 중심선 좌표는 bx * BLOCK_SIZE 가 됨.
        
        if (npc.isVertical) {
          // Z축으로 길게 뻗은 세로 방향 도로 (X좌표가 고정)
          // X좌표: 해당 블록의 도로 중심선(bx * BLOCK_SIZE) + 차선 오프셋
          npc.x = bx * BLOCK_SIZE + npc.laneOffset;
          
          // Z좌표: 플레이어 기준 해당 블록 어딘가 무작위
          npc.z = bz * BLOCK_SIZE + (Math.random() * BLOCK_SIZE - BLOCK_SIZE/2);
          
          // 방향: 우측 통행(양수 오프셋)이면 -Z방향, 좌측 통행(음수 오프셋)이면 +Z방향으로 직진하도록 각도 설정
          npc.angle = isRightLane ? Math.PI : 0; 
        } else {
          // X축으로 길게 뻗은 가로 방향 도로 (Z좌표가 고정)
          // Z좌표: 해당 블록의 도로 중심선(bz * BLOCK_SIZE) + 차선 오프셋 (차선은 이제 도로의 상하)
          npc.z = bz * BLOCK_SIZE + npc.laneOffset;
          
          // X좌표: 해당 블록 어딘가 무작위
          npc.x = bx * BLOCK_SIZE + (Math.random() * BLOCK_SIZE - BLOCK_SIZE/2);
          
          // 방향: 우측 통행(아래쪽 차선)이면 -X방향, 좌측 통행(위쪽 차선)이면 +X방향
          // 우측 차선(Z값이 양수 오프셋)일때 각도 -PI/2 (우측), 좌측 차선일때 PI/2 (좌측)
          npc.angle = isRightLane ? -Math.PI / 2 : Math.PI / 2;
        }

        npc.active = true;
      }


      // NPC 이동 계산 (항상 자기 방향으로 직진)
      npc.x += Math.sin(npc.angle) * (npc.speed * moveDist);
      npc.z += Math.cos(npc.angle) * (npc.speed * moveDist);

      // NPC가 블록 중심(교차로)을 지날 때 무작위로 회전 결정 (차선 유지)
      // 단순화를 위해 무조건 직진만 하도록 수정하여 차선을 절대 벗어나지 않게 함.

      // 거리 체크 (플레이어와 너무 멀어지면 비활성화하여 재생성 유도)
      const dx = npc.x - State.posX;
      const dz = npc.z - State.posZ;
      if (dx*dx + dz*dz > (BLOCK_SIZE * 3.5) * (BLOCK_SIZE * 3.5)) {
        npc.active = false;
        npc.mesh.position.y = -999; // 화면에서 숨김
      } else {
        npc.mesh.position.set(npc.x, 0.3, npc.z); // 바닥에서 살짝 띄움
        npc.mesh.rotation.y = npc.angle;

        // 전조등 야간 자동 On/Off
        if (isNight !== npc.headlightsOn) {
          npc.headlightsOn = isNight;
          const lightColor = isNight ? 0xffffee : 0x555555;
          npc.lights.forEach(l => l.material.color.setHex(lightColor));
        }

        // 플레이어와의 충돌 판정 (단순 반경 체크)
        if (dx*dx + dz*dz < 20) { // 약 4.5미터 거리 내 충돌
          State.speed = -State.speed * 0.4; // 플레이어 튕겨남
          State.posX -= Math.sin(State.angle) * 1.5;
          State.posZ -= Math.cos(State.angle) * 1.5;
        }
      }
    });
  }

  function buildHighPolyCar(type) {
    if (carGroup) scene.remove(carGroup);

    carGroup = new THREE.Group();
    wheels = []; headlightLights = []; tailLights = [];
    const config = CarConfigs[type];

    const bodyMat = new THREE.MeshPhysicalMaterial({ color: config.color, metalness: 0.6, roughness: 0.2, clearcoat: 1.0, clearcoatRoughness: 0.05 });
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x050505, metalness: 0.9, roughness: 0.1, transmission: 0.8, transparent: true });

    const shape = new THREE.Shape();
    shape.moveTo(-2.2, 0.2); shape.lineTo(-2.2, 0.65); shape.lineTo(-1.8, 0.85);
    shape.bezierCurveTo(-1.0, 0.9, -0.6, 1.2, -0.2, 1.25); shape.lineTo(0.6, 1.25);
    shape.bezierCurveTo(1.2, 1.2, 1.4, 0.8, 1.8, 0.75); shape.lineTo(2.4, 0.65);
    shape.bezierCurveTo(2.6, 0.5, 2.6, 0.3, 2.5, 0.2); shape.lineTo(-2.2, 0.2);

    const extrudeSettings = { depth: 1.8, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.08, bevelThickness: 0.08 };
    const bodyGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    bodyGeo.center(); bodyGeo.rotateY(Math.PI / 2);

    carBodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    carBodyMesh.position.y = 0.6; carBodyMesh.castShadow = true;
    carGroup.add(carBodyMesh);

    const glassShape = new THREE.Shape();
    glassShape.moveTo(-1.6, 0.86); glassShape.lineTo(-0.2, 1.26); glassShape.lineTo(0.6, 1.26);
    glassShape.lineTo(1.6, 0.76); glassShape.lineTo(0.6, 0.8); glassShape.lineTo(-0.2, 0.8); glassShape.lineTo(-1.6, 0.86);
    const glassGeo = new THREE.ExtrudeGeometry(glassShape, { depth: 1.82, bevelEnabled: false });
    glassGeo.center(); glassGeo.rotateY(Math.PI / 2);
    const glassMesh = new THREE.Mesh(glassGeo, glassMat);
    glassMesh.position.y = 0.61; carGroup.add(glassMesh);

    const grill = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.2, 0.1), blackMat);
    grill.position.set(0, 0.35, 2.45); carGroup.add(grill);

    if (type === 'gt' || type === 'cybertruck') {
      const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.05, 0.4), blackMat);
      spoilerWing.position.set(0, 1.05, -2.1); spoilerWing.rotation.x = -0.1;
      carGroup.add(spoilerWing);
      const strutL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.25, 0.2), blackMat);
      strutL.position.set(0.6, 0.9, -2.0);
      const strutR = strutL.clone(); strutR.position.x = -0.6;
      carGroup.add(strutL); carGroup.add(strutR);
    }

    const tireGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.35, 32); tireGeo.rotateZ(Math.PI / 2);
    const rimGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.37, 16); rimGeo.rotateZ(Math.PI / 2);
    const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 1.0, roughness: 0.2 });

    const wheelPos = [{ x: 0.95, y: 0.38, z: 1.5 }, { x: -0.95, y: 0.38, z: 1.5 }, { x: 0.95, y: 0.38, z: -1.5 }, { x: -0.95, y: 0.38, z: -1.5 }];
    wheelPos.forEach((p, index) => {
      const wGroup = new THREE.Group();
      const tire = new THREE.Mesh(tireGeo, blackMat); const rim = new THREE.Mesh(rimGeo, rimMat);
      for(let s=0; s<5; s++) {
        const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.45, 0.36), rimMat);
        spoke.rotation.x = (Math.PI / 5) * s; wGroup.add(spoke);
      }
      wGroup.add(tire); wGroup.add(rim);
      wGroup.position.set(p.x, p.y, p.z);
      wGroup.children.forEach(c => c.castShadow = true);
      carGroup.add(wGroup);
      wheels.push({ mesh: wGroup, isFront: index < 2, relX: p.x, relZ: p.z });
    });

    const hlMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const tlMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    for (let i = -1; i <= 1; i += 2) {
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), hlMat);
      hl.position.set(i * 0.6, 0.65, 2.45); hl.rotation.z = i * -0.1; carGroup.add(hl);
      const spot = new THREE.SpotLight(0xffffff, 0, 150, Math.PI / 5, 0.6, 1);
      spot.position.set(i * 0.6, 0.65, 2.5); spot.target.position.set(i * 0.6, 0, 30);
      carGroup.add(spot); carGroup.add(spot.target); headlightLights.push(spot);

      const tl = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), tlMat);
      tl.position.set(i * 0.7, 0.75, -2.25); carGroup.add(tl);
      const redGlow = new THREE.PointLight(0xff0000, 0, 5);
      redGlow.position.set(i * 0.7, 0.75, -2.4); carGroup.add(redGlow); tailLights.push(redGlow);
    }
    underglowLight = new THREE.PointLight(config.color, 0, 12);
    underglowLight.position.set(0, 0.1, 0); carGroup.add(underglowLight);

    scene.add(carGroup);
    updateEnvironmentLighting();
  }

  function setupUIAndEvents() {
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('keydown', (e) => {
      switch(e.code) {
        case 'KeyW': case 'ArrowUp': Input.forward = true; break;
        case 'KeyS': case 'ArrowDown': Input.backward = true; break;
        case 'KeyA': case 'ArrowLeft': Input.left = true; break;
        case 'KeyD': case 'ArrowRight': Input.right = true; break;
        case 'Space': Input.drift = true; break;
        case 'ShiftLeft': case 'ShiftRight': Input.nitro = true; break;
        case 'KeyC': toggleCamera(); break;
        case 'KeyL': toggleHeadlights(); break;
        case 'KeyR': resetCarPosition(); break;
      }
    });

    window.addEventListener('keyup', (e) => {
      switch(e.code) {
        case 'KeyW': case 'ArrowUp': Input.forward = false; break;
        case 'KeyS': case 'ArrowDown': Input.backward = false; break;
        case 'KeyA': case 'ArrowLeft': Input.left = false; break;
        case 'KeyD': case 'ArrowRight': Input.right = false; break;
        case 'Space': Input.drift = false; break;
        case 'ShiftLeft': case 'ShiftRight': Input.nitro = false; break;
      }
    });

    document.getElementById('btn-start-game').addEventListener('click', () => {
      audioSys.init(); State.isPlaying = true;
      document.getElementById('menu-overlay').style.opacity = '0';
      document.getElementById('ui-container').classList.remove('hidden');
      setTimeout(() => document.getElementById('menu-overlay').style.display = 'none', 500);
    });

    document.querySelectorAll('.car-select-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.car-select-btn').forEach(b => {
          b.classList.remove('border-sky-400', 'bg-sky-500/10'); b.classList.add('border-transparent');
          b.querySelector('.font-orbitron').classList.remove('text-sky-300', 'text-white'); b.querySelector('.font-orbitron').classList.add('text-slate-300');
        });
        const target = e.currentTarget;
        target.classList.remove('border-transparent'); target.classList.add('border-sky-400', 'bg-sky-500/10');
        target.querySelector('.font-orbitron').classList.add('text-sky-300');
        State.selectedCar = target.dataset.car;
        buildHighPolyCar(State.selectedCar);
      });
    });

    document.getElementById('btn-env').addEventListener('click', toggleEnvironment);
    document.getElementById('btn-sound').addEventListener('click', () => {
      const active = audioSys.toggle();
      document.getElementById('sound-icon').innerText = active ? '🔊' : '🔇';
      document.getElementById('sound-label').innerText = active ? '음향 ON' : '음향 OFF';
    });
    document.getElementById('btn-camera').addEventListener('click', toggleCamera);

    ['forward','backward','left','right'].forEach((key, idx) => {
      const ids = ['touch-accel', 'touch-brake', 'touch-left', 'touch-right'];
      const btn = document.getElementById(ids[idx]);
      if (btn) {
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); Input[key] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); Input[key] = false; });
      }
    });
  }

  function toggleEnvironment() {
    if (State.envMode === 'day') State.envMode = 'sunset';
    else if (State.envMode === 'sunset') State.envMode = 'night';
    else State.envMode = 'day';

    const labels = { day: '☀️ 낮 (Day)', sunset: '🌅 노을 (Sunset)', night: '🌙 야경 (Night)' };
    document.getElementById('env-label').innerText = labels[State.envMode];
    updateEnvironmentLighting();
  }

  function updateEnvironmentLighting() {
    const ambient = scene.getObjectByName('ambientLight');
    const sun = scene.getObjectByName('sunLight');

    if (State.envMode === 'day') {
      scene.background.setHex(0x87ceeb); scene.fog.color.setHex(0x87ceeb); scene.fog.density = 0.002;
      if (ambient) ambient.intensity = 0.6;
      if (sun) { sun.intensity = 1.5; sun.color.setHex(0xfffbeb); }
      State.headlightsOn = false;
    } else if (State.envMode === 'sunset') {
      scene.background.setHex(0xf97316); scene.fog.color.setHex(0xf97316); scene.fog.density = 0.0025;
      if (ambient) ambient.intensity = 0.3;
      if (sun) { sun.intensity = 0.8; sun.color.setHex(0xfdba74); }
      State.headlightsOn = true;
    } else {
      scene.background.setHex(0x020617); scene.fog.color.setHex(0x020617); scene.fog.density = 0.0035;
      if (ambient) ambient.intensity = 0.1;
      if (sun) { sun.intensity = 0.05; sun.color.setHex(0x38bdf8); }
      State.headlightsOn = true;
    }

    headlightLights.forEach(l => l.intensity = State.headlightsOn ? 3.5 : 0);
    tailLights.forEach(l => l.intensity = State.headlightsOn ? 1.0 : 0);
    if (underglowLight) underglowLight.intensity = State.envMode === 'night' ? 2 : 0;
  }

  function toggleHeadlights() {
    State.headlightsOn = !State.headlightsOn;
    headlightLights.forEach(l => l.intensity = State.headlightsOn ? 3.5 : 0);
    tailLights.forEach(l => l.intensity = State.headlightsOn ? 1.0 : 0);
  }

  function toggleCamera() { State.cameraMode = (State.cameraMode + 1) % 3; }

  function resetCarPosition() {
    State.posX = Math.floor(State.posX / BLOCK_SIZE) * BLOCK_SIZE + BLOCK_SIZE/2; // Center of block
    State.posZ = Math.floor(State.posZ / BLOCK_SIZE) * BLOCK_SIZE + BLOCK_SIZE/2;
    State.angle = 0; State.speed = 0; State.posY = 0;
    showToast("REPOSITIONED", "안전한 도로 중앙으로 복귀했습니다.");
  }

  function showToast(title, sub) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-title').innerText = title; document.getElementById('toast-sub').innerText = sub;
    toast.style.opacity = '1'; toast.style.transform = 'translate(-50%, -50%) scale(1)';
    setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translate(-50%, -50%) scale(0.9)'; }, 2000);
  }

  function initMinimap() {
    const canvas = document.getElementById('minimap');
    canvas.width = canvas.clientWidth || 100; canvas.height = canvas.clientHeight || 100;
    minimapCtx = canvas.getContext('2d');
  }

  // 완벽히 수정된 미니맵 렌더링 함수
  function drawMinimap() {
    if (!minimapCtx || !State.isPlaying) return;
    const canvas = document.getElementById('minimap');
    if (canvas.width !== canvas.clientWidth) {
      canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
    }

    const ctx = minimapCtx;
    const w = canvas.width; const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, w, h);

    const scale = 0.15;
    const cx = w / 2, cy = h / 2;

    const curBx = Math.floor(State.posX / BLOCK_SIZE);
    const curBz = Math.floor(State.posZ / BLOCK_SIZE);

    // 맵 내의 건물(블록) 그리기
    ctx.fillStyle = '#475569';
    for(let dx = -3; dx <= 3; dx++) {
      for(let dz = -3; dz <= 3; dz++) {
        const bx = curBx + dx;
        const bz = curBz + dz;
        if (seededRandom(bx, bz) > 0.22) {
          const blockCenterX = bx * BLOCK_SIZE + BLOCK_SIZE/2;
          const blockCenterZ = bz * BLOCK_SIZE + BLOCK_SIZE/2;

          // Three.js 좌표계를 미니맵(2D Canvas) 좌표계로 변환
          // Three.js: +X는 오른쪽, +Z는 앞쪽(화면 아래로)
          // Canvas: +X는 오른쪽, +Y는 아래쪽
          const mx = cx + (blockCenterX - State.posX) * scale;
          const my = cy + (blockCenterZ - State.posZ) * scale;

          const bw = BUILDING_SPACE * scale * 0.8;
          ctx.fillRect(mx - bw/2, my - bw/2, bw, bw);
        }
      }
    }

    // 플레이어의 아이콘 (수학적 오류 수정됨)
    ctx.save();
    ctx.translate(cx, cy);

    // Three.js에서 Angle 0은 +Z 방향 (Canvas 상에서는 아래쪽).
    // 우리가 원하는 것은 차가 전진하는 방향이 직관적으로 그려지는 것.
    // Three.js 에서는 Angle이 양수면 왼쪽으로 돈다 (반시계).
    // Math.sin(angle), Math.cos(angle)을 이용하여 이동하므로:
    // angle = 0 일때, x += 0, z += speed => 아래로 이동
    // angle = PI/2 일때, x += speed, z += 0 => 오른쪽으로 이동
    // 캔버스 회전은 양수가 시계방향이므로, -angle로 회전시킵니다.
    // 단, 기준 각도(0도 일때 아래를 향함)를 보정하기 위해 추가로 회전이 필요할 수 있습니다.
    // 기존에 -angle 이었으나, 직관성을 위해 방향 벡터를 계산하여 atan2를 쓰는 것이 가장 정확합니다.

    const moveX = Math.sin(State.angle);
    const moveZ = Math.cos(State.angle);
    // Canvas에서 Y축은 Three.js의 Z축과 같습니다.
    // atan2(y, x) -> 여기서 y는 moveZ, x는 moveX
    const drawAngle = Math.atan2(moveZ, moveX);

    // 미니맵에서 직관적으로 "전진"하는 방향이 뾰족한 쪽이 되도록
    // 삼각함수의 0도 기준은 우측(3시) 이므로, 거기에 맞춰서 삼각형을 그립니다.
    ctx.rotate(drawAngle);

    ctx.fillStyle = '#38bdf8';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#38bdf8';
    
    // 우측(3시 방향)을 향하는 뾰족한 삼각형
    ctx.beginPath();
    ctx.moveTo(6, 0);  // 뾰족한 앞부분 (Right)
    ctx.lineTo(-4, 4); // 좌측 뒤
    ctx.lineTo(-2, 0); // 오목한 뒷부분
    ctx.lineTo(-4, -4);// 우측 뒤
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function updateInfiniteWorld(carX, carZ) {
    const curBx = Math.floor(carX / BLOCK_SIZE); const curBz = Math.floor(carZ / BLOCK_SIZE);
    groundPlane.position.x = curBx * BLOCK_SIZE + BLOCK_SIZE/2;
    groundPlane.position.z = curBz * BLOCK_SIZE + BLOCK_SIZE/2;

    if (curBx !== lastBlockX || curBz !== lastBlockZ) {
      lastBlockX = curBx; lastBlockZ = curBz;
      const dummy = new THREE.Object3D();
      let counts = [0, 0, 0], sidewalkCount = 0;
      activeColliders = [];
      sidewalkAreas = []; // Clear and rebuild sidewalk areas

      for (let dx = -INSTANCE_GRID_RADIUS; dx <= INSTANCE_GRID_RADIUS; dx++) {
        for (let dz = -INSTANCE_GRID_RADIUS; dz <= INSTANCE_GRID_RADIUS; dz++) {
          const bx = curBx + dx; const bz = curBz + dz;
          const hashVal = seededRandom(bx, bz);
          const posX = bx * BLOCK_SIZE + BLOCK_SIZE/2; const posZ = bz * BLOCK_SIZE + BLOCK_SIZE/2;

          dummy.position.set(posX, 0, posZ); dummy.scale.set(1, 1, 1); dummy.updateMatrix();
          sidewalkMesh.setMatrixAt(sidewalkCount++, dummy.matrix);

          // Add sidewalk area to track for bumping
          sidewalkAreas.push({ x: posX, z: posZ, halfW: BUILDING_SPACE / 2, halfD: BUILDING_SPACE / 2 });

          if (hashVal > 0.22) {
            const typeIndex = Math.floor((hashVal * 100) % 3);
            const meshIndex = counts[typeIndex];

            if (meshIndex < MAX_INSTANCES) {
              const height = 35 + hashVal * 220;
              const widthX = BUILDING_SPACE * (0.65 + hashVal * 0.3);
              const widthZ = BUILDING_SPACE * (0.65 + seededRandom(bz, bx) * 0.3);

              dummy.position.set(posX, 0.4, posZ);
              dummy.scale.set(widthX, height, widthZ); dummy.updateMatrix();
              bldgMeshes[typeIndex].setMatrixAt(meshIndex, dummy.matrix);
              counts[typeIndex]++;

              if (Math.abs(dx) <= 2 && Math.abs(dz) <= 2) {
                activeColliders.push({ x: posX, z: posZ, halfW: widthX / 2, halfD: widthZ / 2 });
              }
            }
          }
        }
      }

      dummy.scale.set(0,0,0); dummy.updateMatrix();
      for(let j = sidewalkCount; j < MAX_INSTANCES; j++) sidewalkMesh.setMatrixAt(j, dummy.matrix);
      sidewalkMesh.instanceMatrix.needsUpdate = true;
      for(let i=0; i<3; i++) {
        for(let j = counts[i]; j < MAX_INSTANCES; j++) bldgMeshes[i].setMatrixAt(j, dummy.matrix);
        bldgMeshes[i].instanceMatrix.needsUpdate = true;
      }
    }
  }

  function updatePhysics() {
    if (!State.isPlaying) return;
    const config = CarConfigs[State.selectedCar];

    // Check if on sidewalk (보도블럭 위 확인)
    let onSidewalk = false;
    for (let sa of sidewalkAreas) {
      if (Math.abs(State.posX - sa.x) < sa.halfW && Math.abs(State.posZ - sa.z) < sa.halfD) {
        onSidewalk = true;
        break;
      }
    
    // 예시: updatePhysics 함수 내부
    // 배터리 소모 로직
if (Math.abs(State.speed) > 0) {
  let drain = config.batteryDrainRate;

  if (Input.nitro) {
    drain *= 3;
  }

  State.battery -= drain;
}


    // 배터리 방전 시 멈춤
    if (State.battery <= 0) {
      State.battery = 0;
      State.speed = 0;
    }
    }

    // 보도블럭 위면 속도 감소율 증가 및 Z좌표(여기선 Y축) 약간 상승
    const friction = onSidewalk ? 0.95 : 0.985;
    const targetY = onSidewalk ? 0.2 : 0.0;
    // 부드러운 Y축 상승 효과
    State.posY += (targetY - State.posY) * 0.2;

    let currentAccel = config.accel;
    // 보도블럭 위에서는 가속도도 약간 감소
    if (onSidewalk) currentAccel *= 0.8;

    if (Input.nitro && State.nitro > 2 && !onSidewalk) { // 보도블럭 위에서는 니트로 불가
      currentAccel *= 1.65; State.nitro -= 0.6; State.isBoosting = true;
      camera.fov = THREE.MathUtils.lerp(camera.fov, 78, 0.1);
    } else {
      State.nitro = Math.min(100, State.nitro + 0.12); State.isBoosting = false;
      camera.fov = THREE.MathUtils.lerp(camera.fov, 60, 0.1);
    }
    camera.updateProjectionMatrix();

    if (Input.forward) { State.speed += currentAccel; State.gear = 'D'; }
    else if (Input.backward) { State.speed -= currentAccel * 0.8; if (State.speed < 0) State.gear = 'R'; }
    else { State.speed *= friction; } // 도로에 따른 마찰력 적용

    const maxSpd = State.isBoosting ? config.maxSpeed * 1.35 : config.maxSpeed;
    State.speed = Math.max(-config.maxSpeed * 0.3, Math.min(maxSpd, State.speed));

    const steerSensitivity = config.handling * (1 - Math.min(Math.abs(State.speed) / 420, 0.55));
    if (Input.left) State.steering = Math.min(0.65, State.steering + steerSensitivity);
    else if (Input.right) State.steering = Math.max(-0.65, State.steering - steerSensitivity);
    else State.steering *= 0.78;

    if (Input.drift && Math.abs(State.speed) > 30) {
      State.speed *= config.brake; State.isDrifting = true;
      State.angle += State.steering * 0.085;
      const pts = Math.floor(Math.abs(State.speed * State.steering) * 0.9);
      State.driftScore += pts; State.totalDriftScore += pts;

      if (wheels.length >= 4) {
        const sin = Math.sin(State.angle), cos = Math.cos(State.angle);
        wheels.slice(2).forEach(w => {
          const wx = State.posX + (w.relX * cos + w.relZ * sin);
          const wz = State.posZ + (-w.relX * sin + w.relZ * cos);
          spawnSkidMark(wx, wz, State.angle, Math.min(1.0, Math.abs(State.speed) / 100));
        });
      }
    } else {
      State.isDrifting = false;
      State.angle += State.steering * (State.speed / 1000);
    }

    const moveDist = State.speed * 0.016;
    let nextX = State.posX + Math.sin(State.angle) * moveDist;
    let nextZ = State.posZ + Math.cos(State.angle) * moveDist;
    let collided = false; const carRadius = 2.5;

    // 건물과 충돌 처리
    for (let b of activeColliders) {
      if (Math.abs(nextX - b.x) < (b.halfW + carRadius) && Math.abs(nextZ - b.z) < (b.halfD + carRadius)) {
        collided = true; break;
      }
    }

    if (collided) {
      State.speed = -State.speed * 0.35;
      State.posX -= Math.sin(State.angle) * 1.2; State.posZ -= Math.cos(State.angle) * 1.2;
    } else {
      State.posX = nextX; State.posZ = nextZ;
    }

    if (carGroup) {
      // Y축 상승 효과 적용
      carGroup.position.set(State.posX, State.posY, State.posZ);
      carGroup.rotation.y = State.angle;
      
      // 보도블럭 위에서는 차체가 덜컹거리는 효과 추가
      if (onSidewalk && Math.abs(State.speed) > 10) {
        carGroup.rotation.x = Math.sin(Date.now() * 0.05) * 0.01;
        carGroup.rotation.z = Math.cos(Date.now() * 0.05) * 0.01;
      } else {
        carGroup.rotation.x = 0;
        if (carBodyMesh) carBodyMesh.rotation.z = THREE.MathUtils.lerp(carBodyMesh.rotation.z, -State.steering * (State.speed / 180), 0.15);
      }

      const isBraking = Input.backward || Input.drift;
      tailLights.forEach(l => l.intensity = isBraking ? 4.0 : (State.headlightsOn ? 1.0 : 0));
      wheels.forEach(w => {
        w.mesh.children[0].rotation.x += moveDist * 0.8; w.mesh.children[1].rotation.x += moveDist * 0.8;
        if (w.isFront) w.mesh.rotation.y = State.steering * 0.75;
      });
    }

    State.rpm = 800 + Math.abs(State.speed) * 28;
    audioSys.update(Math.abs(State.speed), State.rpm, State.isDrifting, Input.forward);
    updateInfiniteWorld(State.posX, State.posZ);
    updateNPCCars(); // NPC 트래픽 업데이트
    updateParticles();
    updateCamera();
    updateHUD();
  }

  function updateParticles() {
    if (!particleGeo) return;
    const positions = particleGeo.attributes.position.array;
    const opacities = particleGeo.attributes.opacity.array;

    if (State.isDrifting && Math.abs(State.speed) > 25) {
      const sin = Math.sin(State.angle), cos = Math.cos(State.angle);
      for(let e = 0; e < 2; e++) {
        const side = (e === 0) ? 0.9 : -0.9; const pIdx = particleIdx * 3;
        positions[pIdx] = State.posX + (-side * cos - 1.6 * sin) + (Math.random()-0.5)*0.3;
        positions[pIdx + 1] = State.posY + 0.25; // 파티클 높이도 Y보정 반영
        positions[pIdx + 2] = State.posZ + (side * sin - 1.6 * cos) + (Math.random()-0.5)*0.3;
        opacities[particleIdx] = 0.85;
        particleIdx = (particleIdx + 1) % particleCount;
      }
    }

    for(let i = 0; i < particleCount; i++) {
      const pY = i * 3 + 1;
      if(positions[pY] > -100) {
        positions[pY] += 0.06; positions[pY - 1] += (Math.random()-0.5)*0.08; positions[pY + 1] += (Math.random()-0.5)*0.08;
        opacities[i] -= 0.02;
        if(opacities[i] <= 0) positions[pY] = -999;
      }
    }
    particleGeo.attributes.position.needsUpdate = true; particleGeo.attributes.opacity.needsUpdate = true;
  }

  function updateCamera() {
    if (!carGroup) return;
    if (State.cameraMode === 0) {
      const dist = 10.5 + (State.speed / 65); const height = 4.2 - Math.min(State.speed / 220, 0.9);
      const targetX = State.posX - Math.sin(State.angle) * dist, targetZ = State.posZ - Math.cos(State.angle) * dist;
      camera.position.x += (targetX - camera.position.x) * 0.12;
      camera.position.y += ((height + State.posY) - camera.position.y) * 0.12; // 카메라 높이도 Y보정
      camera.position.z += (targetZ - camera.position.z) * 0.12;
      camera.up.set(0, 1, 0);
      camera.lookAt(State.posX + Math.sin(State.angle) * 5, 1.0 + State.posY, State.posZ + Math.cos(State.angle) * 5);
    } else if (State.cameraMode === 1) {
      camera.position.set(State.posX + Math.sin(State.angle) * 0.5, 1.35 + State.posY, State.posZ + Math.cos(State.angle) * 0.5);
      camera.up.set(0, 1, 0);
      camera.lookAt(State.posX + Math.sin(State.angle) * 20, 1.2 + State.posY, State.posZ + Math.cos(State.angle) * 20);
    } else {
      camera.position.x += (State.posX - camera.position.x) * 0.1;
      camera.position.z += (State.posZ - camera.position.z) * 0.1;
      camera.position.y = 65; camera.up.set(0, 1, 0); camera.lookAt(camera.position.x, 0, camera.position.z);
    }

    const sun = scene.getObjectByName('sunLight');
    if (sun) {
      sun.position.set(camera.position.x + 200, 300, camera.position.z + 150);
      sun.target.position.set(camera.position.x, 0, camera.position.z);
      sun.target.updateMatrixWorld();
    }
  }

  function updateHUD() {
    document.getElementById('hud-speed').innerText = Math.floor(Math.abs(State.speed));
    document.getElementById('hud-rpm').innerText = Math.floor(State.rpm);
    document.getElementById('hud-gear').innerText = State.gear;
    document.getElementById('nitro-bar').style.width = `${State.nitro}%`;

    const driftBox = document.getElementById('drift-box');
    if (State.isDrifting) {
      driftBox.style.opacity = '1'; document.getElementById('drift-score').innerText = State.driftScore; driftBox.classList.add('scale-105');
    } else {
      driftBox.classList.remove('scale-105');
      if (State.driftScore > 0) setTimeout(() => { driftBox.style.opacity = '0'; State.driftScore = 0; }, 1500);
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    updatePhysics();
    drawMinimap();
    renderer.render(scene, camera);
  }
</script>
