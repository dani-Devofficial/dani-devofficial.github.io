<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Online Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111827;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .run {
      background: #2563eb;
      color: white;
    }

    .clear {
      background: #374151;
      color: white;
    }

    .download {
      background: #10b981;
      color: white;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .panel-title {
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: #e5e7eb;
      border-bottom: 1px solid #d1d5db;
      font-weight: bold;
      font-size: 14px;
    }

    #editor {
      flex: 1;
      width: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 16px;
      background: #1e293b;
      color: #e2e8f0;
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      line-height: 1.6;
      tab-size: 2;
    }

    .preview-wrapper {
      flex: 1;
      background: white;
      overflow: hidden;
    }

    #preview {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 50% 50%;
      }

      header h1 {
        font-size: 16px;
      }

      button {
        padding: 7px 9px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>HTML Online Viewer</h1>

    <div class="buttons">
      <button class="run" onclick="runHTML()">▶ 실행</button>
      <button class="clear" onclick="clearEditor()">지우기</button>
      <button class="download" onclick="downloadHTML()">다운로드</button>
    </div>
  </header>

  <main>

    <!-- HTML Editor -->
    <section class="panel">
      <div class="panel-title">HTML Code</div>

      <textarea id="editor" spellcheck="false"><!DOCTYPE html>
<html>
<head>
  <title>Hello World</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #2563eb;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Hello World!</h1>
  <p>HTML Online Viewer입니다.</p>
  <button onclick="alert('안녕하세요!')">
    클릭하세요
  </button>
</body>
</html></textarea>
    </section>

    <!-- Preview -->
    <section class="panel">
      <div class="panel-title">Preview</div>

      <div class="preview-wrapper">
        <iframe
          id="preview"
          sandbox="allow-scripts allow-forms allow-modals">
        </iframe>
      </div>
    </section>

  </main>

  <script>
    const editor = document.getElementById("editor");
    const preview = document.getElementById("preview");

    // HTML 실행
    function runHTML() {
      preview.srcdoc = editor.value;
    }

    // 에디터 내용 삭제
    function clearEditor() {
      editor.value = "";
      preview.srcdoc = "";
      editor.focus();
    }

    // HTML 파일 다운로드
    function downloadHTML() {
      const html = editor.value;

      const blob = new Blob(
        [html],
        { type: "text/html;charset=utf-8" }
      );

      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      a.click();

      URL.revokeObjectURL(url);
    }

    // 입력할 때마다 실시간 미리보기
    editor.addEventListener("input", () => {
      preview.srcdoc = editor.value;
    });

    // Tab 키를 누르면 스페이스 2칸
    editor.addEventListener("keydown", (event) => {
      if (event.key === "Tab") {
        event.preventDefault();

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        editor.value =
          editor.value.substring(0, start) +
          "  " +
          editor.value.substring(end);

        editor.selectionStart = editor.selectionEnd = start + 2;

        preview.srcdoc = editor.value;
      }
    });

    // 최초 실행
    runHTML();
  </script>

</body>
</html>
