<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 – Dani</title>
<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  color: white;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── 메인 ── */
main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  padding: 2rem;
}

/* ── 로그인 카드 (홈 .glass 스타일 기반) ── */
.login-card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  padding: 2.5rem 3rem;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  width: 100%;
  max-width: 420px;
  border: 1px solid rgba(255,255,255,0.10);
}

.login-title {
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 0.3rem;
  letter-spacing: -0.3px;
}

.login-sub {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.55);
  margin-bottom: 2rem;
}

/* ── 폼 ── */
.form-group {
  margin-bottom: 1.2rem;
}

.form-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  margin-bottom: 6px;
}

input[type=email],
input[type=password] {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.07);
  color: #fff;
  font-family: 'Segoe UI', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

input[type=email]::placeholder,
input[type=password]::placeholder {
  color: rgba(255,255,255,0.3);
}

input:focus {
  border-color: #0ff;
  box-shadow: 0 0 0 3px rgba(0,255,255,0.12);
  background: rgba(255,255,255,0.11);
}

.forgot {
  display: block;
  font-size: 12px;
  color: #0ff;
  text-align: right;
  margin-top: 6px;
  text-decoration: none;
  opacity: 0.85;
  transition: opacity 0.2s;
}
.forgot:hover { opacity: 1; }

/* ── 체크박스 ── */
.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 1.5rem;
}

.checkbox-row input[type=checkbox] {
  width: 15px;
  height: 15px;
  accent-color: #0ff;
}

.checkbox-row label {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
}

/* ── 버튼 ── */
.btn-primary {
  width: 100%;
  height: 46px;
  background: rgba(0,255,255,0.18);
  color: #fff;
  border: 1px solid rgba(0,255,255,0.5);
  border-radius: 10px;
  font-family: 'Segoe UI', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
}

.btn-primary:hover {
  background: rgba(0,255,255,0.3);
  box-shadow: 0 0 20px rgba(0,255,255,0.25);
}

.btn-primary:active { transform: scale(0.98); }

/* ── 하단 링크 ── */
.signup-text {
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-top: 1.5rem;
}

.signup-text a {
  color: #0ff;
  text-decoration: none;
  font-weight: 600;
}

.signup-text a:hover { text-decoration: underline; }

</style>
</head>
<body>

<!-- 로그인 카드 -->
<main>
  <div class="login-card">
    <p class="login-title">다시 오셨군요</p>
    <p class="login-sub">계정에 로그인하세요</p>

    <div class="form-group">
      <label class="form-label">이메일</label>
      <input type="email" placeholder="name@example.com">
    </div>

    <div class="form-group">
      <label class="form-label">비밀번호</label>
      <input type="password" placeholder="••••••••">
      <a class="forgot" href="#">비밀번호를 잊으셨나요?</a>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="remember">
      <label for="remember">로그인 상태 유지</label>
    </div>

    <button class="btn-primary">로그인</button>

    <p class="signup-text">계정이 없으신가요? <a href="./newuser.html">무료로 가입하기</a></p>
  </div>
</main>

</body>
</html>
