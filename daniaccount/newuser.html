<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 – Dani</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem;
}

.login-card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  padding: 2.5rem 3rem;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  width: 100%;
  max-width: 420px;
  border: 1px solid rgba(255,255,255,0.10);
}

.login-title {
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 0.3rem;
  letter-spacing: -0.3px;
}

.login-sub {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.55);
  margin-bottom: 2rem;
}

.form-group { margin-bottom: 1.2rem; }

.form-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  margin-bottom: 6px;
}

input[type=email],
input[type=password],
input[type=text] {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.07);
  color: #fff;
  font-family: 'Segoe UI', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

input::placeholder { color: rgba(255,255,255,0.3); }

input:focus {
  border-color: #0ff;
  box-shadow: 0 0 0 3px rgba(0,255,255,0.12);
  background: rgba(255,255,255,0.11);
}

/* 유효성 상태 */
input.input-error  { border-color: rgba(255,80,80,0.7) !important; }
input.input-ok     { border-color: rgba(0,255,180,0.6) !important; }

.hint {
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  margin-top: 5px;
  display: block;
}

/* 에러 / 성공 메시지 */
.msg {
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 1.2rem;
  display: none;
  line-height: 1.5;
}

.msg.error {
  background: rgba(255, 80, 80, 0.15);
  border: 1px solid rgba(255, 80, 80, 0.4);
  color: #ff9090;
}

.msg.success {
  background: rgba(0, 255, 180, 0.12);
  border: 1px solid rgba(0, 255, 180, 0.35);
  color: #7fffd4;
}

.btn-primary {
  width: 100%;
  height: 46px;
  background: rgba(0,255,255,0.18);
  color: #fff;
  border: 1px solid rgba(0,255,255,0.5);
  border-radius: 10px;
  font-family: 'Segoe UI', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.04em;
  margin-top: 0.4rem;
  transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary:hover {
  background: rgba(0,255,255,0.3);
  box-shadow: 0 0 20px rgba(0,255,255,0.25);
}

.btn-primary:active { transform: scale(0.98); }

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* 스피너 */
.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: none;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* 비밀번호 강도 바 */
.pw-strength {
  margin-top: 7px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,0.1);
  overflow: hidden;
}

.pw-strength-bar {
  height: 100%;
  width: 0%;
  border-radius: 2px;
  transition: width 0.3s, background 0.3s;
}

.signup-text {
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-top: 1.5rem;
}

.signup-text a {
  color: #0ff;
  text-decoration: none;
  font-weight: 600;
}

.signup-text a:hover { text-decoration: underline; }

</style>
</head>
<body>
  <div class="login-card">
    <p class="login-title">회원가입</p>
    <p class="login-sub">무료로 계정을 만들어보세요</p>

    <!-- 메시지 영역 -->
    <div class="msg error"   id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>

    <div class="form-group">
      <label class="form-label">이메일 (아이디)</label>
      <input type="email" id="email" placeholder="name@example.com">
    </div>

    <div class="form-group">
      <label class="form-label">비밀번호</label>
      <input type="password" id="password" placeholder="••••••••">
      <div class="pw-strength"><div class="pw-strength-bar" id="pwBar"></div></div>
      <span class="hint" id="pwHint">영문, 숫자 포함 8자 이상</span>
    </div>

    <div class="form-group">
      <label class="form-label">비밀번호 확인</label>
      <input type="password" id="passwordConfirm" placeholder="••••••••">
    </div>

    <button class="btn-primary" id="signupBtn">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">회원가입</span>
    </button>

    <p class="signup-text">이미 계정이 있으신가요? <a href="./login.html">로그인</a></p>
  </div>

<script>
  // ── Supabase 초기화 ────────────────────────────────
  const SUPABASE_URL  = 'https://kbxsqbqglqcxkiprbpqf.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtieHNxYnFnbHFjeGtpcHJicHFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNTAzMTksImV4cCI6MjA5MjgyNjMxOX0.t3WZ3Ir8W-Ur26nJBPHiQc0o3Ii8oDStzj4v-FF4BAM';

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

  // ── DOM 참조 ──────────────────────────────────────
  const emailInput  = document.getElementById('email');
  const pwInput     = document.getElementById('password');
  const pw2Input    = document.getElementById('passwordConfirm');
  const signupBtn   = document.getElementById('signupBtn');
  const spinner     = document.getElementById('spinner');
  const btnText     = document.getElementById('btnText');
  const errorMsg    = document.getElementById('errorMsg');
  const successMsg  = document.getElementById('successMsg');
  const pwBar       = document.getElementById('pwBar');
  const pwHint      = document.getElementById('pwHint');

  // ── 메시지 헬퍼 ──────────────────────────────────
  function showError(text) {
    errorMsg.textContent     = text;
    errorMsg.style.display   = 'block';
    successMsg.style.display = 'none';
  }

  function showSuccess(text) {
    successMsg.textContent  = text;
    successMsg.style.display = 'block';
    errorMsg.style.display   = 'none';
  }

  function clearMessages() {
    errorMsg.style.display   = 'none';
    successMsg.style.display = 'none';
  }

  function setLoading(on) {
    signupBtn.disabled     = on;
    spinner.style.display  = on ? 'block' : 'none';
    btnText.textContent    = on ? '처리 중…' : '회원가입';
  }

  // ── 비밀번호 강도 체크 ────────────────────────────
  pwInput.addEventListener('input', () => {
    const val = pwInput.value;
    let score = 0;
    if (val.length >= 8)          score++;
    if (/[a-zA-Z]/.test(val))     score++;
    if (/[0-9]/.test(val))        score++;
    if (/[^a-zA-Z0-9]/.test(val)) score++;

    const colors = ['', '#ff5050', '#ffaa00', '#00e5ff', '#00ffb3'];
    const labels = ['', '너무 짧아요', '약함', '보통', '강함'];
    const widths = ['0%', '25%', '50%', '75%', '100%'];

    pwBar.style.width      = widths[score];
    pwBar.style.background = colors[score];
    if (val.length === 0) {
      pwHint.textContent = '영문, 숫자 포함 8자 이상';
      pwBar.style.width  = '0%';
    } else {
      pwHint.textContent = `비밀번호 강도: ${labels[score]}`;
    }
  });

  // ── 비밀번호 확인 실시간 체크 ────────────────────
  pw2Input.addEventListener('input', () => {
    if (pw2Input.value === '') {
      pw2Input.classList.remove('input-ok', 'input-error');
      return;
    }
    if (pw2Input.value === pwInput.value) {
      pw2Input.classList.add('input-ok');
      pw2Input.classList.remove('input-error');
    } else {
      pw2Input.classList.add('input-error');
      pw2Input.classList.remove('input-ok');
    }
  });

  // ── 회원가입 ──────────────────────────────────────
  signupBtn.addEventListener('click', async () => {
    clearMessages();

    const email    = emailInput.value.trim();
    const password = pwInput.value;
    const password2 = pw2Input.value;

    // 클라이언트 유효성 검사
    if (!email || !password || !password2) {
      showError('모든 항목을 입력해주세요.');
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('올바른 이메일 형식이 아니에요.');
      return;
    }

    if (password.length < 8) {
      showError('비밀번호는 8자 이상이어야 해요.');
      return;
    }

    if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
      showError('비밀번호에 영문과 숫자를 모두 포함해주세요.');
      return;
    }

    if (password !== password2) {
      showError('비밀번호가 일치하지 않아요.');
      pw2Input.classList.add('input-error');
      return;
    }

    setLoading(true);

    const { data, error } = await sb.auth.signUp({ email, password });

    setLoading(false);

    if (error) {
      showError(translateError(error.message));
      return;
    }

    // 이메일 인증 필요 여부 확인
    const needsConfirm = !data.session;

    if (needsConfirm) {
      showSuccess(`📧 ${email} 으로 인증 메일을 보냈어요!\n메일함을 확인하고 링크를 클릭하면 가입이 완료돼요.`);
      successMsg.style.whiteSpace = 'pre-line';
      // 입력 필드 비우기
      emailInput.value = '';
      pwInput.value    = '';
      pw2Input.value   = '';
      pwBar.style.width = '0%';
      pwHint.textContent = '영문, 숫자 포함 8자 이상';
      [pw2Input].forEach(el => el.classList.remove('input-ok', 'input-error'));
    } else {
      // 이메일 인증 없이 바로 로그인된 경우 (Supabase 설정에 따라)
      showSuccess('가입 완료! 잠시 후 이동합니다…');
      setTimeout(() => { window.location.href = './index.html'; }, 1000);
    }
  });

  // ── 엔터 키 지원 ─────────────────────────────────
  [emailInput, pwInput, pw2Input].forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') signupBtn.click();
    });
  });

  // ── 에러 메시지 한국어 변환 ───────────────────────
  function translateError(msg) {
    if (!msg) return '알 수 없는 오류가 발생했어요.';
    if (msg.includes('User already registered') || msg.includes('already been registered'))
      return '이미 가입된 이메일이에요. 로그인해주세요.';
    if (msg.includes('Password should be'))
      return '비밀번호가 너무 약해요. 영문, 숫자 포함 8자 이상으로 설정해주세요.';
    if (msg.includes('Unable to validate email'))
      return '올바른 이메일 형식이 아니에요.';
    if (msg.includes('Too many requests'))
      return '요청이 너무 많아요. 잠시 후 다시 시도해주세요.';
    if (msg.includes('Network'))
      return '네트워크 오류가 발생했어요. 인터넷 연결을 확인해주세요.';
    return msg;
  }
</script>

</body>
</html>
