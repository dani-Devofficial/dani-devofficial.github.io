<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 – Dani</title>
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem;
}

.login-card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  padding: 2.5rem 3rem;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  width: 100%;
  max-width: 420px;
  border: 1px solid rgba(255,255,255,0.10);
}

.login-title {
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 0.3rem;
  letter-spacing: -0.3px;
}

.login-sub {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.55);
  margin-bottom: 2rem;
}

.form-group { margin-bottom: 1.2rem; }

.form-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  margin-bottom: 6px;
}

input[type=email],
input[type=password],
input[type=text] {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.07);
  color: #fff;
  font-family: 'Segoe UI', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

input::placeholder { color: rgba(255,255,255,0.3); }

input:focus {
  border-color: #0ff;
  box-shadow: 0 0 0 3px rgba(0,255,255,0.12);
  background: rgba(255,255,255,0.11);
}

.hint {
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  margin-top: 5px;
  display: block;
}

.btn-primary {
  width: 100%;
  height: 46px;
  background: rgba(0,255,255,0.18);
  color: #fff;
  border: 1px solid rgba(0,255,255,0.5);
  border-radius: 10px;
  font-family: 'Segoe UI', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.04em;
  margin-top: 0.4rem;
  transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
}

.btn-primary:hover {
  background: rgba(0,255,255,0.3);
  box-shadow: 0 0 20px rgba(0,255,255,0.25);
}

.btn-primary:active { transform: scale(0.98); }

.signup-text {
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-top: 1.5rem;
}

.signup-text a {
  color: #0ff;
  text-decoration: none;
  font-weight: 600;
}

.signup-text a:hover { text-decoration: underline; }

</style>
</head>
<body>
  <div class="login-card">
    <p class="login-title">회원가입</p>
    <p class="login-sub">무료로 계정을 만들어보세요</p>

    <div class="form-group">
      <label class="form-label">이메일 (아이디)</label>
      <input type="email" placeholder="name@example.com">
    </div>

    <div class="form-group">
      <label class="form-label">비밀번호</label>
      <input type="password" placeholder="••••••••">
      <span class="hint">영문, 숫자 포함 8자 이상</span>
    </div>

    <div class="form-group">
      <label class="form-label">비밀번호 확인</label>
      <input type="password" placeholder="••••••••">
    </div>

    <button class="btn-primary">회원가입</button>

    <p class="signup-text">이미 계정이 있으신가요? <a href="./login.html">로그인</a></p>
  </div>
</body>
</html>
