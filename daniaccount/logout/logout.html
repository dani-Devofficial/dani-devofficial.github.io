<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그아웃 – Dani</title>
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem;
}

.login-card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  padding: 2.5rem 3rem;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  width: 100%;
  max-width: 420px;
  border: 1px solid rgba(255,255,255,0.10);
  text-align: center;
}

.icon-wrap {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255, 80, 80, 0.15);
  border: 1px solid rgba(255, 80, 80, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.5rem;
}

.icon-wrap svg { width: 24px; height: 24px; }

.login-title {
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 0.3rem;
  letter-spacing: -0.3px;
}

.login-sub {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.55);
  line-height: 1.6;
  margin-bottom: 2rem;
}

.btn-logout {
  width: 100%;
  height: 46px;
  background: rgba(255, 80, 80, 0.2);
  color: #fff;
  border: 1px solid rgba(255, 80, 80, 0.55);
  border-radius: 10px;
  font-family: 'Segoe UI', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.04em;
  margin-bottom: 0.75rem;
  transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
}

.btn-logout:hover {
  background: rgba(255, 80, 80, 0.35);
  box-shadow: 0 0 20px rgba(255, 80, 80, 0.2);
}

.btn-logout:active { transform: scale(0.98); }

.btn-cancel {
  width: 100%;
  height: 46px;
  background: rgba(255,255,255,0.07);
  color: rgba(255,255,255,0.7);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  font-family: 'Segoe UI', sans-serif;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}

.btn-cancel:hover { background: rgba(255,255,255,0.12); }
.btn-cancel:active { transform: scale(0.98); }

</style>
</head>
<body>
  <div class="login-card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="rgba(255,100,100,0.9)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 17L21 12L16 7" stroke="rgba(255,100,100,0.9)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 12H9" stroke="rgba(255,100,100,0.9)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <p class="login-title">로그아웃</p>
    <p class="login-sub">정말 로그아웃하시겠습니까?<br>언제든지 다시 로그인할 수 있습니다.</p>

    <button class="btn-logout" onclick="location.href='./logout-clear.html'">로그아웃</button>
    <button class="btn-cancel" onclick="history.back()">취소</button>
  </div>
</body>
</html>
