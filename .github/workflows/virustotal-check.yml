# .github/workflows/virustotal-scan.yml
name: VirusTotal Scan on Push

on:
  push:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - name: Compress repository
        run: |
          zip -r repo.zip . \
            -x ".git/*" \
            -x ".github/*"

      - name: Upload to VirusTotal
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          RESPONSE=$(curl -s --request POST \
            --url https://www.virustotal.com/api/v3/files \
            --header "x-apikey: $VT_API_KEY" \
            --form file=@repo.zip)

          echo "$RESPONSE"

          ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.data.id')

          echo "analysis_id=$ANALYSIS_ID" >> $GITHUB_OUTPUT

      - name: Wait for analysis
        run: sleep 30

      - name: Get result
        id: result
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          RESULT=$(curl -s --request GET \
            --url https://www.virustotal.com/api/v3/analyses/${{ steps.vt.outputs.analysis_id }} \
            --header "x-apikey: $VT_API_KEY")

          echo "$RESULT"

          MALICIOUS=$(echo "$RESULT" | jq '.data.attributes.stats.malicious')

          echo "malicious=$MALICIOUS" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue if malware detected
        if: steps.result.outputs.malicious != '0'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "⚠️ VirusTotal detected malware",
              body: `
              VirusTotal detected malicious content.

              Repository: ${context.repo.owner}/${context.repo.repo}
              Commit: ${context.sha}

              Malicious detections: ${{ steps.result.outputs.malicious }}

              Workflow Run:
              https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              `
            })
