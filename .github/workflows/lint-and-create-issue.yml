name: Lint and Create Issue

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Lint HTML
        run: |
          curl -X POST -d @index.html http://validator.w3.org/nu/?out=json
          && echo 'HTML linting completed.'

      - name: Lint CSS
        run: |
          curl -X POST -d @style.css http://jigsaw.w3.org/css-validator/validator?text=@style.css&profile=css3&output=json
          && echo 'CSS linting completed.'

      - name: Lint JS
        run: |
          npm install -g jshint
          && jshint script.js
          && echo 'JS linting completed.'

      - name: Create Issue for Errors
        if: failure()  
        run: |
          if [ $? -ne 0 ]; then
            gh issue create --title "Linting Errors Detected" --body "Linting found errors in the code. Please review!";
          fi
