<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human AI for App Inventor</title>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f4f9; }
    .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    video { width: 100%; height: auto; background-color: #000; border-radius: 8px; transform: scaleX(-1); }
    #result { margin: 15px 0; font-size: 15px; font-weight: bold; color: #333; min-height: 40px; word-break: break-all; }
    .btn { background-color: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Human AI 인식기</h2>
    <video id="video" autoplay playsinline muted></video>
    <div id="result">초기화 준비 중...</div>
    <button id="detectBtn" class="btn" disabled>얼굴 인식하기</button>
  </div>

  <script>
    const config = {
      modelBasePath: 'https://cdn.jsdelivr.net/npm/@vladmandic/human/models/',
      face: {
        enabled: true,
        detector: { enabled: true },
        mesh: { enabled: true },
        iris: { enabled: false },
        description: { enabled: true },
        emotion: { enabled: false }
      },
      body: { enabled: false },
      hand: { enabled: false }
    };

    const human = new Human.Human(config);
    const videoEl = document.getElementById('video');
    const resultEl = document.getElementById('result');
    const detectBtn = document.getElementById('detectBtn');

    async function main() {
      try {
        resultEl.innerText = "1/3. AI 모델 로드 중...";
        await human.load();

        resultEl.innerText = "2/3. 카메라 연결 중...";
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });

        videoEl.srcObject = stream;

        await new Promise((resolve) => {
          videoEl.onloadeddata = () => {
            videoEl.play();
            resolve();
          };
        });

        resultEl.innerText = "3/3. 준비 완료! 버튼을 누르세요.";
        detectBtn.disabled = false;

      } catch (err) {
        console.error("초기화 에러:", err);
        resultEl.style.color = "red";
        resultEl.innerText = "오류 발생: " + err.message;
      }
    }

    detectBtn.addEventListener('click', async () => {
      detectBtn.disabled = true;
      resultEl.style.color = "#333";
      resultEl.innerText = "얼굴 분석 중...";

      try {
        const result = await human.detect(videoEl);

        if (result.face && result.face.length > 0) {
          const face = result.face[0];
          const age = face.age ? Math.round(face.age) : "unknown";
          const gender = face.gender ? face.gender : "unknown";

          resultEl.innerText = `[인식 성공]\n나이: 약 ${age}세 / 성별: ${gender}\n(5초 뒤 결과 주소로 이동합니다...)`;

          // -------------------------------------------------------------
          // ⏱️ [핵심 기능] 판정 후 5초 뒤 주소 변경
          // -------------------------------------------------------------
          setTimeout(() => {
            // 주소 끝에 결과 파라미터(?age=...&gender=...)를 붙여서 변경
            // 예: http://.../index.html?age=25&gender=male
            const newUrl = `{age}&{gender}`;
            
            // 또는 앱인벤터 통신 전용 해시(#)로 주소 변경
            // const newUrl = window.location.pathname + `#age=${age}&gender=${gender}`;

            window.location.href = newUrl;
          }, 5000); // 5000ms = 5초

        } else {
          resultEl.innerText = "얼굴을 감지하지 못했습니다. 다시 시도해 주세요.";
          detectBtn.disabled = false;
        }
      } catch (err) {
        console.error("분석 에러:", err);
        resultEl.style.color = "red";
        resultEl.innerText = "분석 실패: " + err.message;
        detectBtn.disabled = false;
      }
    });

    main();
  </script>
</body>
</html>
