<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>공지사항</title>
  <style>
    :root{--bg:#f7f9fc;--card:#fff;--muted:#6b7280;--accent:#0b78ff}
    body{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); color:#111; margin:0; padding:24px}
    header{display:flex;align-items:center;gap:16px;margin-bottom:18px}
    a.home{color:var(--accent);text-decoration:none;font-weight:600}
    h1{margin:0;font-size:1.4rem}
    .controls{display:flex;gap:12px;align-items:center;margin:12px 0}
    input[type=search]{flex:1;padding:8px 12px;border:1px solid #e6e9ef;border-radius:8px}
    select{padding:8px;border-radius:8px;border:1px solid #e6e9ef}
    ul.list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
    li.card{background:var(--card);border-radius:10px;padding:12px;border:1px solid rgba(15,23,42,0.04);box-shadow:0 1px 2px rgba(16,24,40,0.03);cursor:pointer}
    li.card h3{margin:0 0 8px 0;font-size:1rem}
    .meta{font-size:0.85rem;color:var(--muted);margin-bottom:8px}
    .summary{color:#111;opacity:0.9;font-size:0.95rem}
    .empty{padding:20px;text-align:center;color:var(--muted)}
    /* modal */
    #modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,0.6);z-index:60}
    .dialog{background:var(--card);width:min(880px,96%);max-height:90vh;overflow:auto;border-radius:10px;padding:18px;border:1px solid rgba(15,23,42,0.06)}
    .dialog h2{margin:0 0 8px 0}
    .dialog .date{color:var(--muted);font-size:0.9rem;margin-bottom:12px}
    .dialog .content{white-space:pre-wrap;color:#111}
    .close{position:absolute;right:18px;top:12px;background:transparent;border:0;color:var(--muted);font-size:18px;cursor:pointer}
    footer{margin-top:18px;color:var(--muted);font-size:0.9rem}
    @media (max-width:420px){.controls{flex-direction:column;align-items:stretch}}
  </style>
</head>
<body>
  <header>
    <a class="home" href="/">홈</a>
    <h1>공지사항</h1>
  </header>

  <div class="controls">
    <input id="search" type="search" placeholder="검색어로 공지 검색 (제목, 내용, 태그)">
    <select id="sort" aria-label="정렬">
      <option value="dateDesc">최신순</option>
      <option value="dateAsc">오래된순</option>
      <option value="titleAsc">제목 A→Z</option>
      <option value="titleDesc">제목 Z→A</option>
    </select>
  </div>

  <ul id="list" class="list" aria-live="polite">
    <li class="empty">로딩 중…</li>
  </ul>



  <footer>데이터: <code>./noticedata.json</code></footer>

  <script>
    // 안전한 HTML 이스케이프
    function escapeHtml(str){
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/\"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    function formatDate(d){
      try{const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit'});}catch(e){return d}
    }

    let notices = [];
    const listEl = document.getElementById('list');
    const searchEl = document.getElementById('search');
    const sortEl = document.getElementById('sort');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDate = document.getElementById('modal-date');
    const modalContent = document.getElementById('modal-content');
    const closeBtn = document.getElementById('closeBtn');

    async function loadData(){
      try{
        const res = await fetch('./noticedata.json', {cache: 'no-store'});
        if(!res.ok) throw new Error('HTTP '+res.status);
        const data = await res.json();
        if(!Array.isArray(data)){
          console.warn('noticedata.json is not an array, wrapping into array');
          notices = [data];
        } else notices = data;
        renderList();
      }catch(err){
        console.error(err);
        listEl.innerHTML = '<li class="empty">공지 데이터를 불러올 수 없습니다. (console 참고)</li>';
      }
    }

    function renderList(){
      const q = searchEl.value.trim().toLowerCase();
      const sorted = [...notices].sort((a,b)=>{
        const sa = (a.date||a.created_at||'').toString();
        const sb = (b.date||b.created_at||'').toString();
        if(sortEl.value === 'dateDesc') return (new Date(sb) - new Date(sa));
        if(sortEl.value === 'dateAsc') return (new Date(sa) - new Date(sb));
        const ta = (a.title||'').toLowerCase();
        const tb = (b.title||'').toLowerCase();
        if(sortEl.value === 'titleAsc') return ta.localeCompare(tb);
        if(sortEl.value === 'titleDesc') return tb.localeCompare(ta);
        return 0;
      });

      const filtered = sorted.filter(item=>{
        if(!q) return true;
        const fields = [(item.title||''), (item.content||item.body||''), (item.tags||'')].join(' ').toLowerCase();
        return fields.includes(q);
      });

      if(filtered.length === 0){
        listEl.innerHTML = '<li class="empty">조건에 맞는 공지가 없습니다.</li>';
        return;
      }

      listEl.innerHTML = filtered.map(item=>{
        const title = escapeHtml(item.title || item.heading || '무제 공지');
        const date = formatDate(item.date || item.created_at || '');
        const raw = (item.content || item.body || '');
        const rawStr = String(raw || '');
        const excerpt = rawStr.length > 200 ? rawStr.slice(0,200) + '…' : rawStr;
        const summary = escapeHtml(excerpt);
        return `
<li class="card" data-id="${escapeHtml(item.id||item.title||date)}" tabindex="0">
  <h3>${title}</h3>
  <div class="meta">${date}</div>
  <div class="summary">${summary}</div>
</li>`;
      }).join('\n');

      // attach click handlers
      Array.from(listEl.querySelectorAll('.card')).forEach(el=>{
        el.addEventListener('click', ()=>openModal(el.getAttribute('data-id')));
        el.addEventListener('keypress', (e)=>{ if(e.key === 'Enter') openModal(el.getAttribute('data-id')) });
      });
    }

    function findById(id){
      return notices.find(n => (String(n.id||n.title||formatDate(n.date||n.created_at||'')) === String(id)));
    }

    function openModal(id){
      const item = findById(id);
      if(!item || !modal) return;
      if (modalTitle) modalTitle.textContent = item.title || item.heading || '무제 공지';
      if (modalDate) modalDate.textContent = formatDate(item.date || item.created_at || '');
      // show content safely
      const raw = item.content || item.body || '';
      if (modalContent) modalContent.innerHTML = escapeHtml(raw).replace(/\n/g,'<br>');
      modal.hidden = false;
      document.body.style.overflow = 'hidden';
      if (closeBtn) closeBtn.focus();
    }

    function closeModal(){
      if (!modal) return;
      modal.hidden = true;
      document.body.style.overflow = '';
    }

    // events
    if (searchEl) searchEl.addEventListener('input', ()=>renderList());
    if (sortEl) sortEl.addEventListener('change', ()=>renderList());
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    if (modal) modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && modal && !modal.hidden) closeModal(); });

    // init
    loadData();
  </script>
</body>
</html>
