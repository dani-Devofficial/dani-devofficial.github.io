<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공지사항</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f9fafb;
      color: #333;
      margin: 20px;
    }
    h1 { color: #2563eb; }
    ul { list-style: none; padding: 0; }
    li {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .date { font-size: 12px; color: #666; }
    .title { font-weight: bold; margin-top: 4px; }
    .content { margin-top: 6px; }
  </style>
</head>
<body>
  <h1>공지사항</h1>
  <ul id="noticeList"></ul>

  <script>
    fetch('./data.json')
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById('noticeList');
        data.forEach(item => {
          const li = document.createElement('li');
          li.innerHTML = `
            <div class="date">${item.date}</div>
            <div class="title">${item.title}</div>
            <div class="content">${item.content}</div>
          `;
          list.appendChild(li);
        });
      })
      .catch(err => console.error('공지 불러오기 실패:', err));
  </script>
</body>
</html>
