<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hCaptcha + Supabase 연동</title>
    <!-- hCaptcha 공식 스크립트 로드 -->
    <script src="https://hcaptcha.com" async defer></script>
    <style>
        /* 간단한 모바일 최적화 UI 스타일 */
        body { font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        form { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 350px; }
        button { padding: 12px; font-size: 16px; background-color: #0070f3; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h2>온라인 hCaptcha 인증 테스트</h2>
    
    <form id="captchaForm">
        <!-- 1. 발급받은 hCaptcha Site Key 입력 -->
        <div class="h-captcha" data-sitekey="1948c522-5106-4060-b554-0b201648de0a" data-callback="onCaptchaSuccess"></div>
        
        <!-- 처음에는 비활성화, 캡차 완료 시 활성화 -->
        <button type="submit" id="submitBtn" disabled>인증서버로 전송</button>
    </form>

    <script>
        let captchaToken = null;

        // 유저가 캡차 문제를 풀면 자동으로 호출되는 함수
        function onCaptchaSuccess(token) {
            captchaToken = token;
            document.getElementById("submitBtn").disabled = false;
        }

        document.getElementById("captchaForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!captchaToken) {
                alert("캡차 인증을 먼저 진행해주세요.");
                return;
            }

            // 2. 본인의 Supabase 프로젝트 ID 입력
            const SUPABASE_PROJECT_ID = "kbxsqbqglqcxkiprbpqf"; 
            const functionUrl = `https://${SUPABASE_PROJECT_ID}.functions.supabase.co/verify-hcaptcha`;

            try {
                // Supabase Edge Function(백엔드)으로 토큰 검증 요청
                const response = await fetch(functionUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: captchaToken })
                });

                const result = await response.json();

                if (result.success) {
                    alert("✅ 인증 성공! 당신은 봇이 아닙니다.");
                } else {
                    alert("❌ 인증 실패! 다시 시도해주세요.");
                }
            } catch (error) {
                console.error("통신 에러:", error);
                alert("서버와 통신하는 중 오류가 발생했습니다.");
            }
        });
    </script>
</body>
</html>
