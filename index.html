<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>인증이 필요합니다.</title>

  <!-- hCaptcha 공식 API -->
  <script
    src="https://js.hcaptcha.com/1/api.js"
    async
    defer
  ></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 350px;
    }

    button {
      padding: 12px;
      font-size: 16px;
      background-color: #0070f3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <h2>인증이 필요합니다.</h2>

  <form id="captchaForm">
    <div
      class="h-captcha"
      data-sitekey="1948c522-5106-4060-b554-0b201648de0a"
      data-callback="onCaptchaSuccess"
      data-expired-callback="onCaptchaExpired"
    ></div>

    <button
      type="submit"
      id="submitBtn"
      disabled
    >
      사이트로 이동하기
    </button>
  </form>

  <script>
    let captchaToken = null

    function onCaptchaSuccess(token) {
      captchaToken = token

      document.getElementById(
        "submitBtn"
      ).disabled = false
    }

    function onCaptchaExpired() {
      captchaToken = null

      document.getElementById(
        "submitBtn"
      ).disabled = true

      alert("캡차가 만료되었습니다.")
    }

    document
      .getElementById("captchaForm")
      .addEventListener(
        "submit",
        async (e) => {
          e.preventDefault()

          if (!captchaToken) {
            alert(
              "캡차 인증을 먼저 진행해주세요."
            )
            return
          }

          const SUPABASE_PROJECT_ID =
            "vqtolrqlqvfpzjsedjrw"

          const functionUrl =
            `https://${SUPABASE_PROJECT_ID}.functions.supabase.co/verify-hcaptcha`

          const submitBtn =
            document.getElementById(
              "submitBtn"
            )

          submitBtn.disabled = true
          submitBtn.innerText =
            "검증 중..."

          try {
            const response =
              await fetch(functionUrl, {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/json",
                },
                body: JSON.stringify({
                  token: captchaToken,
                }),
              })

            const result =
              await response.json()

            if (result.success) {
              alert("✅ 인증 성공")

              window.location.replace(
                "https://dani.ggm.kr/site_index.html"
              )
            } else {
              alert(
                "❌ 인증 실패! 다시 시도해주세요."
              )

              hcaptcha.reset()

              captchaToken = null

              submitBtn.disabled = true
              submitBtn.innerText =
                "사이트로 이동하기"
            }
          } catch (error) {
            console.error(
              "통신 에러:",
              error
            )

            alert(
              "서버와 통신하는 중 오류가 발생했습니다."
            )

            submitBtn.disabled = false
            submitBtn.innerText =
              "사이트로 이동하기"
          }
        }
      )
  </script>
</body>
</html>
